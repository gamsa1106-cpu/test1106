<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>라틴어 문법 | Grammatica Latina</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #000000;
    --card:   #111111;
    --border: #333333;
    --text:   #ffffff;
    --sub:    #a0a0a0;
    --accent: #e0c068;
  }

  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    background: #000000; border-bottom: 2px solid #fff;
    padding: 24px 5% 28px; text-align: center;
  }
  .back-link {
    display: inline-block; margin-bottom: 10px;
    color: #fff; text-decoration: none; font-size: 0.82rem;
    border: 1px solid #fff; padding: 5px 12px; border-radius: 8px;
    transition: all 0.2s;
  }
  .back-link:hover { background: #fff; color: #000; }
  .header-title { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.5px; }
  .header-sub { font-size: 0.85rem; margin-top: 6px; color: var(--sub); }

  .container { max-width: 820px; margin: 0 auto; padding: 26px 20px 60px; }

  /* ── 품사 탭 ── */
  .tab-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .tab-btn {
    padding: 10px 16px; border: 1px solid #fff; background: #000;
    border-radius: 999px; font-weight: 700; font-size: 0.88rem; cursor: pointer;
    color: #fff; transition: all 0.15s;
  }
  .tab-btn.active { background: #fff; color: #000; }

  .section-view { display: none; }
  .section-view.active { display: block; }

  .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .section-icon { font-size: 1.6rem; }
  .section-nameko { font-size: 1.4rem; font-weight: 800; }
  .section-namela { font-size: 1rem; color: var(--sub); font-style: italic; }

  .section-intro {
    margin-top: 12px; padding: 14px 18px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; font-size: 0.95rem; line-height: 1.7; color: #eaeaea;
  }

  .point-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .point-item {
    display: flex; gap: 10px; font-size: 0.92rem; line-height: 1.6; color: #dcdcdc;
    padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--card);
    border-radius: 0 8px 8px 0;
  }

  /* ── 변화표 ── */
  .table-block { margin-top: 22px; }
  .table-title { font-size: 0.98rem; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
  table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  th, td { padding: 9px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { background: #1c1c1c; color: var(--accent); font-weight: 700; }
  tr:last-child td { border-bottom: none; }
  td:first-child { color: var(--sub); font-weight: 600; }

  @media (max-width: 480px) {
    .header-title { font-size: 1.3rem; }
    table { font-size: 0.82rem; }
    th, td { padding: 7px 8px; }
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="../index.html">← 포트폴리오로</a>
  <div class="header-title">✒️ Grammatica Latina 라틴어 문법</div>
  <div class="header-sub">품사별 기초 문법 학습 — 명사·동사·형용사부터 감탄사까지</div>
</header>

<div class="container">
  <div class="tab-nav" id="tabNav"></div>
  <div id="sectionContainer"></div>
</div>

<script src="data.js"></script>
<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderTabs() {
  document.getElementById('tabNav').innerHTML = GRAMMAR_SECTIONS.map((s, i) => `
    <button class="tab-btn ${i === 0 ? 'active' : ''}" id="tabBtn-${s.id}" onclick="switchSection('${s.id}')">
      ${s.icon} ${escapeHtml(s.nameKo)}
    </button>
  `).join('');
}

function renderTable(t) {
  return `
    <div class="table-block">
      <div class="table-title">${escapeHtml(t.title)}</div>
      <table>
        <thead><tr>${t.cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>
          ${t.rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderSections() {
  document.getElementById('sectionContainer').innerHTML = GRAMMAR_SECTIONS.map((s, i) => `
    <div class="section-view ${i === 0 ? 'active' : ''}" id="section-${s.id}">
      <div class="section-head">
        <span class="section-icon">${s.icon}</span>
        <span class="section-nameko">${escapeHtml(s.nameKo)}</span>
        <span class="section-namela">${escapeHtml(s.nameLa)}</span>
      </div>
      <div class="section-intro">${escapeHtml(s.intro)}</div>
      <div class="point-list">
        ${s.points.map(p => `<div class="point-item">${escapeHtml(p)}</div>`).join('')}
      </div>
      ${s.tables.map(renderTable).join('')}
    </div>
  `).join('');
}

function switchSection(id) {
  GRAMMAR_SECTIONS.forEach(s => {
    document.getElementById('section-' + s.id).classList.toggle('active', s.id === id);
    document.getElementById('tabBtn-' + s.id).classList.toggle('active', s.id === id);
  });
}

renderTabs();
renderSections();
</script>

</body>
</html>

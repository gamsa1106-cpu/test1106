<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성경 언어 학습 | 헬라어 · 히브리어 · 라틴어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:  #4f46e5;
      --primary2: #7c3aed;
      --text:     #1e293b;
      --sub:      #64748b;
      --bg:       #f8fafc;
      --card:     #ffffff;
      --border:   #e2e8f0;
      --green:    #16a34a;
      --red:      #dc2626;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95);
      color: #fff;
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-icon { font-size: 30px; }
    .header-title { font-size: 1.2rem; font-weight: 800; }
    .header-sub   { font-size: 0.78rem; opacity: 0.7; margin-top: 2px; }
    .back-link {
      color: rgba(255,255,255,0.8); text-decoration: none;
      font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 14px; border-radius: 8px; transition: all 0.2s;
    }
    .back-link:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .container { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }

    /* 언어 탭 */
    .lang-tabs {
      display: flex; gap: 6px; margin-bottom: 20px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 5px;
    }
    .lang-tab {
      flex: 1; padding: 11px 6px; border: none; border-radius: 10px;
      font-size: 0.88rem; font-weight: 700; cursor: pointer;
      background: transparent; color: var(--sub); transition: all 0.25s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .lang-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff; box-shadow: 0 4px 14px rgba(79,70,229,0.35);
    }

    /* 모드 탭 */
    .mode-tabs { display: flex; gap: 6px; margin-bottom: 20px; }
    .mode-tab {
      padding: 8px 18px; border: 1.5px solid var(--border);
      border-radius: 30px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; background: #fff; color: var(--sub); transition: all 0.2s;
    }
    .mode-tab.active { border-color: var(--primary); background: #ede9fe; color: var(--primary); }

    /* 진도 */
    .progress-bar-wrap {
      background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 18px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 18px;
    }
    .progress-stats { display: flex; gap: 16px; flex-shrink: 0; }
    .stat { text-align: center; }
    .stat-val { font-size: 1.15rem; font-weight: 800; color: var(--primary); }
    .stat-lbl { font-size: 10px; color: var(--sub); margin-top: 1px; }
    .progress-right { flex: 1; }
    .progress-label { font-size: 0.78rem; color: var(--sub); margin-bottom: 5px; display: flex; justify-content: space-between; }
    .progress-track { height: 7px; background: var(--border); border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary2)); border-radius: 6px; transition: width 0.5s ease; }

    /* 플래시카드 */
    .flashcard-area { perspective: 1200px; margin-bottom: 20px; }
    .flashcard {
      width: 100%; min-height: 320px; cursor: pointer;
      position: relative; transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; min-height: 320px;
      border-radius: 20px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12); gap: 8px; padding: 28px 24px;
    }
    .card-front { background: linear-gradient(135deg, #1e1b4b, #312e81); color: #fff; }
    .card-back  { background: linear-gradient(135deg, #f0fdf4, #dcfce7); transform: rotateY(180deg); }
    .card-lang-badge {
      position: absolute; top: 14px; left: 14px;
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9);
      font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .card-back .card-lang-badge { background: rgba(22,163,74,0.15); color: var(--green); }
    .card-num-badge {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9);
      font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .card-word {
      font-size: clamp(2rem, 6.5vw, 2.8rem); font-weight: 800;
      text-align: center; line-height: 1.2; letter-spacing: 2px;
    }
    .card-transliteration { font-size: 0.95rem; opacity: 0.65; font-style: italic; }
    .card-meaning     { font-size: 1.7rem; font-weight: 800; color: var(--green); }
    .card-meaning-sub { font-size: 0.82rem; color: var(--sub); text-align: center; }
    .card-verse {
      margin-top: 6px; padding-top: 10px;
      border-top: 1px solid rgba(22,163,74,0.25);
      text-align: center; width: 100%;
    }
    .card-verse-ref  { font-size: 0.72rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .card-verse-text { font-size: 0.78rem; color: var(--sub); font-style: italic; line-height: 1.5; }
    .card-hint {
      font-size: 0.72rem; opacity: 0.45; position: absolute;
      bottom: 12px; right: 16px;
    }

    /* 카드 컨트롤 */
    .card-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 10px 20px; border-radius: 12px; border: 1.5px solid var(--border);
      background: #fff; color: var(--text); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px;
    }
    .ctrl-btn:hover { border-color: var(--primary); color: var(--primary); }
    .ctrl-btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px rgba(79,70,229,0.3);
    }
    .ctrl-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(79,70,229,0.4); }
    .ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
    .tts-btn {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 12px rgba(14,165,233,0.3);
    }
    .tts-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(14,165,233,0.4); border-color: transparent; color: #fff; }
    .tts-btn.speaking { animation: tts-pulse 0.8s infinite alternate; }
    @keyframes tts-pulse { from { box-shadow: 0 4px 12px rgba(14,165,233,0.3); } to { box-shadow: 0 4px 20px rgba(14,165,233,0.7); } }

    /* OX 퀴즈 */
    .quiz-word-card {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      color: #fff; border-radius: 20px; padding: 44px 32px;
      text-align: center; margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15); position: relative;
    }
    .quiz-word        { font-size: clamp(1.8rem, 5.5vw, 2.6rem); font-weight: 800; letter-spacing: 2px; margin-bottom: 6px; }
    .quiz-transliteration { font-size: 0.95rem; opacity: 0.62; font-style: italic; }
    .quiz-q-num {
      position: absolute; top: 14px; right: 16px;
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9);
      font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .quiz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .choice-btn {
      padding: 16px 12px; border-radius: 14px; border: 2px solid var(--border);
      background: #fff; color: var(--text); font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--primary); background: #ede9fe; color: var(--primary); transform: translateY(-2px); }
    .choice-btn.correct { border-color: var(--green); background: #f0fdf4; color: var(--green); }
    .choice-btn.wrong   { border-color: var(--red);   background: #fef2f2; color: var(--red); }
    .choice-btn:disabled { cursor: not-allowed; }

    .quiz-feedback {
      padding: 12px 16px; border-radius: 14px; margin-bottom: 12px;
      font-size: 0.88rem; font-weight: 600; display: none; line-height: 1.5;
    }
    .quiz-feedback.correct { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; }
    .quiz-feedback.wrong   { background: #fef2f2; color: var(--red);   border: 1px solid #fecaca; }
    .quiz-feedback .fb-verse { margin-top: 6px; font-size: 0.8rem; font-weight: 400; font-style: italic; opacity: 0.85; }

    /* 완료 화면 */
    .complete-screen {
      display: none; text-align: center; background: #fff;
      border-radius: 20px; padding: 44px 28px;
      border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .complete-emoji  { font-size: 60px; margin-bottom: 14px; }
    .complete-title  { font-size: 1.7rem; font-weight: 900; margin-bottom: 6px; }
    .complete-stars  { font-size: 1.8rem; margin: 16px 0 6px; }
    .complete-score  { font-size: 2.8rem; font-weight: 900; color: var(--primary); margin-bottom: 6px; }
    .complete-score-sub { color: var(--sub); margin-bottom: 24px; }

    /* 단어 목록 */
    .word-list-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--sub); margin-bottom: 10px; }
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 8px; }
    .word-chip {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 13px; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer; transition: all 0.2s;
    }
    .word-chip:hover { border-color: var(--primary); background: #f5f3ff; }
    .w-orig { font-weight: 700; font-size: 0.95rem; }
    .w-mean { color: var(--sub); font-size: 0.75rem; margin-top: 1px; }
    .w-kr   { font-size: 0.95rem; font-weight: 700; color: var(--text); }

    @media (max-width: 520px) {
      .progress-stats { gap: 10px; }
      .quiz-choices { grid-template-columns: 1fr; }
      .card-word { font-size: 1.8rem; }
      .lang-tab { font-size: 0.78rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-icon">📖</div>
    <div>
      <div class="header-title">성경 언어 학습</div>
      <div class="header-sub">Biblical Greek · Hebrew · Latin</div>
    </div>
  </div>
  <a href="../index.html" class="back-link">← 포트폴리오로</a>
</header>

<div class="container">

  <!-- 언어 탭 -->
  <div class="lang-tabs">
    <button class="lang-tab active" id="tab-greek"  onclick="setLang('greek')">🏛️ 헬라어</button>
    <button class="lang-tab"        id="tab-hebrew" onclick="setLang('hebrew')">✡️ 히브리어</button>
    <button class="lang-tab"        id="tab-latin"  onclick="setLang('latin')">✝️ 라틴어</button>
  </div>

  <!-- 모드 탭 -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="mode-flash" onclick="setMode('flash')">📇 플래시카드</button>
    <button class="mode-tab"        id="mode-quiz"  onclick="setMode('quiz')">❓ OX 퀴즈</button>
    <button class="mode-tab"        id="mode-list"  onclick="setMode('list')">📋 단어 목록</button>
  </div>

  <!-- 진도 -->
  <div class="progress-bar-wrap" id="progressBar">
    <div class="progress-stats">
      <div class="stat"><div class="stat-val" id="statCard">1</div><div class="stat-lbl">현재</div></div>
      <div class="stat"><div class="stat-val" id="statTotal">20</div><div class="stat-lbl">전체</div></div>
      <div class="stat"><div class="stat-val" id="statScore">0</div><div class="stat-lbl">정답</div></div>
      <div class="stat"><div class="stat-val" id="statStreak">0</div><div class="stat-lbl">연속</div></div>
    </div>
    <div class="progress-right">
      <div class="progress-label"><span>학습 진도</span><span id="progressPct">0%</span></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>

  <!-- 플래시카드 -->
  <div id="flashArea">
    <div class="flashcard-area">
      <div class="flashcard" id="flashcard" onclick="flipCard()">
        <div class="card-face card-front">
          <div class="card-lang-badge" id="cardLangBadge">Greek</div>
          <div class="card-num-badge"  id="cardNumBadge">1 / 20</div>
          <div class="card-word"       id="cardWord">λόγος</div>
          <div class="card-transliteration" id="cardTranslit">logos</div>
          <div class="card-hint">탭하여 뜻 확인</div>
        </div>
        <div class="card-face card-back">
          <div class="card-lang-badge">뜻</div>
          <div class="card-meaning"     id="cardMeaning">말씀</div>
          <div class="card-meaning-sub" id="cardMeaningSub">logos — 하나님의 말씀, 이성</div>
          <div class="card-verse">
            <div class="card-verse-ref"  id="cardVerseRef">요한복음 1:1</div>
            <div class="card-verse-text" id="cardVerseText">"태초에 말씀이 계시니라"</div>
          </div>
          <div class="card-hint">탭하여 뒤집기</div>
        </div>
      </div>
    </div>
    <div class="card-controls">
      <button class="ctrl-btn" id="prevBtn" onclick="prevCard()" disabled>← 이전</button>
      <button class="ctrl-btn tts-btn" id="ttsBtn" onclick="speakWord()">🔊 발음 듣기</button>
      <div id="ttsNote" style="font-size:0.72rem;color:var(--sub);text-align:center;margin-top:4px"></div>
      <button class="ctrl-btn primary" id="nextBtn" onclick="nextCard()">다음 →</button>
    </div>
  </div>

  <!-- OX 퀴즈 -->
  <div id="quizArea" style="display:none">
    <div class="quiz-word-card">
      <div class="quiz-q-num" id="quizQNum">1 / 20</div>
      <div class="quiz-word"          id="quizWord">λόγος</div>
      <div class="quiz-transliteration" id="quizTranslit">logos</div>
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div class="quiz-choices"  id="quizChoices"></div>
    <div style="text-align:center">
      <button class="ctrl-btn tts-btn" id="ttsBtnQuiz" onclick="speakWord()" style="display:inline-flex;margin:0 auto 4px">🔊 발음 듣기</button>
    </div>
  </div>

  <!-- 단어 목록 -->
  <div id="listArea" style="display:none">
    <div class="word-list-title" id="listTitle">헬라어 단어 목록</div>
    <div class="word-grid" id="wordGrid"></div>
  </div>

  <!-- 완료 화면 -->
  <div class="complete-screen" id="completeScreen">
    <div class="complete-emoji">🎉</div>
    <div class="complete-title">학습 완료!</div>
    <div class="complete-stars"    id="completeStars"></div>
    <div class="complete-score"    id="completeScore"></div>
    <div class="complete-score-sub" id="completeScoreSub"></div>
    <button class="ctrl-btn primary" onclick="restartCurrent()" style="margin:0 auto;display:inline-flex">
      🔄 다시 학습하기
    </button>
  </div>

</div>

<script>
// ── 단어 데이터 ──
const vocab = {
  greek: [
    { word:'λόγος',     translit:'logos',      meaning:'말씀',    sub:'하나님의 말씀, 이성, 로고스',         verse:'"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니"',                     verseRef:'요한복음 1:1' },
    { word:'ἀγάπη',     translit:'agapē',      meaning:'사랑',    sub:'희생적이고 무조건적인 사랑',           verse:'"하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니"',                            verseRef:'요한복음 3:16' },
    { word:'πίστις',    translit:'pistis',     meaning:'믿음',    sub:'신뢰, 확신, 충성',                   verse:'"믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니"',                       verseRef:'히브리서 11:1' },
    { word:'χάρις',     translit:'charis',     meaning:'은혜',    sub:'값없이 주시는 은총, 감사',            verse:'"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니"',                      verseRef:'에베소서 2:8' },
    { word:'εἰρήνη',    translit:'eirēnē',     meaning:'평화',    sub:'평강, 화목, 안녕',                   verse:'"평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라"',                        verseRef:'요한복음 14:27' },
    { word:'ζωή',       translit:'zōē',        meaning:'생명',    sub:'영적 생명, 영생',                    verse:'"나는 길이요 진리요 생명이니"',                                                verseRef:'요한복음 14:6' },
    { word:'θεός',      translit:'theos',      meaning:'하나님',  sub:'신, 하나님',                        verse:'"하나님은 사랑이심이라"',                                                      verseRef:'요한일서 4:8' },
    { word:'κύριος',    translit:'kyrios',     meaning:'주님',    sub:'주인, 권위자, 주님',                 verse:'"예수는 주시라 시인하면 구원을 받으리라"',                                       verseRef:'로마서 10:9' },
    { word:'ἄνθρωπος',  translit:'anthrōpos',  meaning:'사람',    sub:'인간, 인류',                        verse:'"하나님이 자기 형상대로 사람을 창조하시되"',                                     verseRef:'창세기 1:27' },
    { word:'κόσμος',    translit:'kosmos',     meaning:'세상',    sub:'우주, 세계, 질서',                   verse:'"하나님이 세상을 이처럼 사랑하사"',                                             verseRef:'요한복음 3:16' },
    { word:'ἀλήθεια',   translit:'alētheia',   meaning:'진리',    sub:'진실, 참됨',                        verse:'"진리를 알지니 진리가 너희를 자유롭게 하리라"',                                  verseRef:'요한복음 8:32' },
    { word:'πνεῦμα',    translit:'pneuma',     meaning:'성령',    sub:'영, 바람, 숨결',                    verse:'"하나님은 영이시니 예배하는 자가 영과 진리로 예배할지니라"',                       verseRef:'요한복음 4:24' },
    { word:'ἐκκλησία',  translit:'ekklēsia',   meaning:'교회',    sub:'불러모인 무리, 회중',                verse:'"이 반석 위에 내 교회를 세우리니 음부의 권세가 이기지 못하리라"',                   verseRef:'마태복음 16:18' },
    { word:'καρδία',    translit:'kardia',     meaning:'마음',    sub:'심장, 내면, 의지',                  verse:'"마음이 청결한 자는 복이 있나니 그들이 하나님을 볼 것임이요"',                     verseRef:'마태복음 5:8' },

// ── 상태 ──
let currentLang = 'greek';
let currentMode = 'flash';
let cardIndex   = 0;
let isFlipped   = false;
let quizIndex   = 0;
let quizScore   = 0;
let quizStreak  = 0;
let quizOrder   = [];
let quizAnswered = false;
let flashVisited = new Set();

// ── 언어 설정 ──
const ttsNotes = {
  greek:  '※ 헬라어(코이네)는 전용 TTS 없음 — 발음기호를 영어로 읽습니다',
  hebrew: '※ 현대 히브리어 발음 (Google TTS)',
  latin:  '※ 라틴어 발음 (Google TTS)',
};

function setLang(lang) {
  currentLang = lang;
  ['greek','hebrew','latin'].forEach(l =>
    document.getElementById('tab-' + l).classList.toggle('active', l === lang)
  );
  const note = document.getElementById('ttsNote');
  if (note) note.textContent = ttsNotes[lang] || '';
  resetAll();
  renderMode();
}

// ── 모드 설정 ──
function setMode(mode) {
  currentMode = mode;
  ['flash','quiz','list'].forEach(m =>
    document.getElementById('mode-' + m).classList.toggle('active', m === mode)
  );
  resetAll();
  renderMode();
}

function resetAll() {
  cardIndex = 0; isFlipped = false;
  quizIndex = 0; quizScore = 0; quizStreak = 0;
  quizAnswered = false; flashVisited = new Set();
  quizOrder = shuffleArray([...Array(words().length).keys()]);
  updateProgress(0, words().length, 0, 0);
}

function words() { return vocab[currentLang]; }

function renderMode() {
  const isFlash = currentMode === 'flash';
  const isQuiz  = currentMode === 'quiz';
  const isList  = currentMode === 'list';
  document.getElementById('flashArea').style.display     = isFlash ? '' : 'none';
  document.getElementById('quizArea').style.display      = isQuiz  ? '' : 'none';
  document.getElementById('listArea').style.display      = isList  ? '' : 'none';
  document.getElementById('progressBar').style.display   = isList  ? 'none' : '';
  document.getElementById('completeScreen').style.display = 'none';
  if (isFlash) renderFlashcard();
  if (isQuiz)  renderQuiz();
  if (isList)  renderList();
}

// ── 플래시카드 ──
function renderFlashcard() {
  const w = words()[cardIndex];
  const isHebrew = currentLang === 'hebrew';
  const langLabel = { greek:'Greek', hebrew:'Hebrew', latin:'Latin' }[currentLang];

  document.getElementById('cardLangBadge').textContent = langLabel;
  document.getElementById('cardNumBadge').textContent  = `${cardIndex + 1} / ${words().length}`;
  document.getElementById('cardWord').textContent      = w.word;
  document.getElementById('cardWord').style.direction  = isHebrew ? 'rtl' : 'ltr';
  document.getElementById('cardTranslit').textContent  = w.translit;
  document.getElementById('cardMeaning').textContent   = w.meaning;
  document.getElementById('cardMeaningSub').textContent = `${w.translit} — ${w.sub}`;
  document.getElementById('cardVerseRef').textContent  = w.verseRef;
  document.getElementById('cardVerseText').textContent = w.verse;

  document.getElementById('flashcard').classList.remove('flipped');
  isFlipped = false;
  flashVisited.add(cardIndex);
  updateProgress(flashVisited.size, words().length, quizScore, quizStreak);
  document.getElementById('statCard').textContent  = cardIndex + 1;
  document.getElementById('prevBtn').disabled = cardIndex === 0;
  document.getElementById('nextBtn').disabled = cardIndex === words().length - 1;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
}

function prevCard() { if (cardIndex > 0) { cardIndex--; renderFlashcard(); } }
function nextCard() {
  if (cardIndex < words().length - 1) { cardIndex++; renderFlashcard(); }
  else showComplete(flashVisited.size, words().length);
}

// ── OX 퀴즈 ──
function renderQuiz() {
  document.getElementById('completeScreen').style.display = 'none';
  document.getElementById('quizArea').style.display = '';
  if (quizIndex >= words().length) { showComplete(quizScore, words().length); return; }

  const w = words()[quizOrder[quizIndex]];
  document.getElementById('quizWord').textContent     = w.word;
  document.getElementById('quizWord').style.direction = currentLang === 'hebrew' ? 'rtl' : 'ltr';
  document.getElementById('quizTranslit').textContent = w.translit;
  document.getElementById('quizQNum').textContent     = `${quizIndex + 1} / ${words().length}`;

  const fb = document.getElementById('quizFeedback');
  fb.style.display = 'none'; fb.className = 'quiz-feedback';

  const choices = generateChoices(quizOrder[quizIndex]);
  const el = document.getElementById('quizChoices');
  el.innerHTML = '';
  quizAnswered = false;
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.meaning;
    btn.onclick = () => answerQuiz(c.correct, btn, quizOrder[quizIndex]);
    el.appendChild(btn);
  });

  updateProgress(quizIndex, words().length, quizScore, quizStreak);
}

function generateChoices(correctIdx) {
  const all = words();
  const wrong = all.filter((_, i) => i !== correctIdx);
  const picks = shuffleArray(wrong).slice(0, 3).map(w => ({ meaning: w.meaning, correct: false }));
  return shuffleArray([...picks, { meaning: all[correctIdx].meaning, correct: true }]);
}

function answerQuiz(isCorrect, clickedBtn, wIdx) {
  if (quizAnswered) return;
  quizAnswered = true;
  const w = words()[wIdx];

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === w.meaning) b.classList.add('correct');
  });
  if (!isCorrect) { clickedBtn.classList.add('wrong'); quizStreak = 0; }
  else            { quizScore++; quizStreak++; }

  const fb = document.getElementById('quizFeedback');
  fb.className = 'quiz-feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = (isCorrect ? '✅ 정답! ' : '❌ 틀렸어요. ')
    + `"${w.word}" (${w.translit}) = ${w.meaning}`
    + `<div class="fb-verse">${w.verseRef} ${w.verse}</div>`;
  fb.style.display = 'block';

  quizIndex++;
  setTimeout(renderQuiz, 2000);
}

// ── 단어 목록 ──
function renderList() {
  const labels = { greek:'헬라어', hebrew:'히브리어', latin:'라틴어' };
  document.getElementById('listTitle').textContent = `${labels[currentLang]} 단어 목록 (20개)`;
  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '';
  words().forEach((w, i) => {
    const chip = document.createElement('div');
    chip.className = 'word-chip';
    chip.innerHTML = `
      <div>
        <div class="w-orig" style="direction:${currentLang === 'hebrew' ? 'rtl' : 'ltr'}">${w.word}</div>
        <div class="w-mean">${w.translit}</div>
      </div>
      <div class="w-kr">${w.meaning}</div>`;
    chip.onclick = () => { setMode('flash'); cardIndex = i; renderFlashcard(); };
    grid.appendChild(chip);
  });
}

// ── TTS 발음 듣기 (Google Translate TTS) ──
let currentAudio = null;

function speakWord() {
  const w = currentWord();
  if (!w) return;

  const btn = document.getElementById(currentMode === 'quiz' ? 'ttsBtnQuiz' : 'ttsBtn');
  const stopAnim = () => { if (btn) btn.classList.remove('speaking'); };

  // 이전 재생 중단
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (btn) btn.classList.add('speaking');

  // 헬라어(코이네)는 전용 TTS 없음 → 발음기호를 영어로 읽기
  if (currentLang === 'greek') {
    if (!('speechSynthesis' in window)) { stopAnim(); return; }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(w.translit);
    utter.lang  = 'en-US';
    utter.rate  = 0.72;
    utter.onend = stopAnim;
    utter.onerror = stopAnim;
    window.speechSynthesis.speak(utter);
    return;
  }

  const langCode = { hebrew: 'he', latin: 'la' }[currentLang] || 'en';
  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(w.word)}&tl=${langCode}&client=tw-ob&ttsspeed=0.7`;

  currentAudio = new Audio(url);
  currentAudio.onended = stopAnim;
  currentAudio.onerror = () => {
    stopAnim();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(w.word);
      utter.lang  = { hebrew: 'he-IL', latin: 'la' }[currentLang] || 'en-US';
      utter.rate  = 0.78;
      utter.onend = stopAnim;
      window.speechSynthesis.speak(utter);
    }
  };
  currentAudio.play().catch(() => currentAudio.onerror());
}

function currentWord() {
  if (currentMode === 'quiz') {
    const idx = Math.min(quizIndex, words().length - 1);
    return words()[quizOrder[idx]];
  }
  return words()[cardIndex];
}

// ── 완료 화면 ──
function showComplete(score, total) {
  document.getElementById('flashArea').style.display   = 'none';
  document.getElementById('quizArea').style.display    = 'none';
  document.getElementById('progressBar').style.display = 'none';
  const el = document.getElementById('completeScreen');
  el.style.display = 'block';
  const pct = Math.round((score / total) * 100);
  document.getElementById('completeStars').textContent    = pct >= 80 ? '⭐⭐⭐' : pct >= 50 ? '⭐⭐' : '⭐';
  document.getElementById('completeScore').textContent    = `${score} / ${total}`;
  document.getElementById('completeScoreSub').textContent = `정답률 ${pct}% — ${pct >= 80 ? '훌륭해요!' : pct >= 50 ? '잘했어요!' : '계속 연습해 보세요!'}`;
}

function restartCurrent() {
  resetAll();
  document.getElementById('completeScreen').style.display = 'none';
  document.getElementById('progressBar').style.display    = '';
  renderMode();
}

function updateProgress(current, total, score, streak) {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  document.getElementById('progressFill').style.width   = pct + '%';
  document.getElementById('progressPct').textContent    = pct + '%';
  document.getElementById('statTotal').textContent      = total;
  document.getElementById('statScore').textContent      = score;
  document.getElementById('statStreak').textContent     = streak;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 초기화
resetAll();
renderMode();
const initNote = document.getElementById('ttsNote');
if (initNote) initNote.textContent = ttsNotes[currentLang] || '';
</script>

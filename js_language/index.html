<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성경 언어 학습 | 헬라어 · 히브리어 · 라틴어 · 영어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:  #4f46e5;
      --primary2: #7c3aed;
      --text:     #1e293b;
      --sub:      #64748b;
      --bg:       #f8fafc;
      --border:   #e2e8f0;
      --green:    #16a34a;
      --red:      #dc2626;
    }

    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #1e1b4b, #312e81, #4c1d95);
      color: #fff; padding: 16px 5%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .header-center {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      text-align: center;
    }
    .header-icon  { font-size: 30px; }
    .header-title { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.5px; }
    .header-sub   { font-size: 0.76rem; opacity: 0.7; }
    .back-link {
      justify-self: start;
      color: rgba(255,255,255,0.85); text-decoration: none;
      font-size: 0.82rem; border: 1px solid rgba(255,255,255,0.3);
      padding: 6px 13px; border-radius: 8px; transition: all 0.2s;
      white-space: nowrap;
    }
    .back-link:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .container { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }

    /* 언어 탭 */
    .lang-tabs {
      display: flex; gap: 5px; margin-bottom: 18px;
      background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 5px;
    }
    .lang-tab {
      flex: 1; padding: 10px 4px; border: none; border-radius: 10px;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      background: transparent; color: var(--sub); transition: all 0.25s;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .lang-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff; box-shadow: 0 4px 14px rgba(79,70,229,0.35);
    }

    /* 모드 탭 */
    .mode-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
    .mode-tab {
      padding: 8px 16px; border: 1.5px solid var(--border);
      border-radius: 30px; font-size: 0.84rem; font-weight: 600;
      cursor: pointer; background: #fff; color: var(--sub); transition: all 0.2s;
    }
    .mode-tab.active { border-color: var(--primary); background: #ede9fe; color: var(--primary); }

    /* 진도 */
    .progress-bar-wrap {
      background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 13px 16px; margin-bottom: 18px;
      display: flex; align-items: center; gap: 16px;
    }
    .progress-stats { display: flex; gap: 14px; flex-shrink: 0; }
    .stat { text-align: center; }
    .stat-val { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
    .stat-lbl { font-size: 10px; color: var(--sub); margin-top: 1px; }
    .progress-right { flex: 1; }
    .progress-label { font-size: 0.76rem; color: var(--sub); margin-bottom: 5px; display: flex; justify-content: space-between; }
    .progress-track { height: 7px; background: var(--border); border-radius: 6px; overflow: hidden; }
    .progress-fill  { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary2)); border-radius: 6px; transition: width 0.5s ease; }

    /* 플래시카드 */
    .flashcard-area { perspective: 1200px; margin-bottom: 16px; }
    .flashcard {
      width: 100%; min-height: 320px; cursor: pointer;
      position: relative; transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; min-height: 320px;
      border-radius: 20px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12); gap: 8px; padding: 28px 24px;
    }
    .card-front { background: linear-gradient(135deg, #1e1b4b, #312e81); color: #fff; }
    .card-back  { background: linear-gradient(135deg, #f0fdf4, #dcfce7); transform: rotateY(180deg); }
    .card-lang-badge {
      position: absolute; top: 14px; left: 14px;
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9);
      font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .card-back .card-lang-badge { background: rgba(22,163,74,0.15); color: var(--green); }
    .card-num-badge {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9);
      font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .card-word { font-size: clamp(1.9rem, 6vw, 2.8rem); font-weight: 800; text-align: center; line-height: 1.2; letter-spacing: 2px; }
    .card-transliteration { font-size: 0.92rem; opacity: 0.65; font-style: italic; }
    .card-meaning     { font-size: 1.65rem; font-weight: 800; color: var(--green); }
    .card-meaning-sub { font-size: 0.8rem; color: var(--sub); text-align: center; }
    .card-verse { margin-top: 6px; padding-top: 10px; border-top: 1px solid rgba(22,163,74,0.25); text-align: center; width: 100%; }
    .card-verse-ref  { font-size: 0.72rem; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .card-verse-text { font-size: 0.76rem; color: var(--sub); font-style: italic; line-height: 1.5; }
    .card-hint { font-size: 0.7rem; opacity: 0.4; position: absolute; bottom: 12px; right: 16px; }

    /* 버튼 */
    .card-controls { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .tts-note { text-align: center; font-size: 0.72rem; color: var(--sub); margin-top: 6px; margin-bottom: 14px; min-height: 1em; }
    .ctrl-btn {
      padding: 10px 20px; border-radius: 12px; border: 1.5px solid var(--border);
      background: #fff; color: var(--text); font-size: 0.84rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px;
    }
    .ctrl-btn:hover { border-color: var(--primary); color: var(--primary); }
    .ctrl-btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(79,70,229,0.3);
    }
    .ctrl-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(79,70,229,0.4); }
    .ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
    .tts-btn {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(14,165,233,0.3);
    }
    .tts-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(14,165,233,0.4); border-color: transparent; color: #fff; }
    .tts-btn.speaking { animation: tts-pulse 0.8s infinite alternate; }
    @keyframes tts-pulse { from { box-shadow: 0 4px 12px rgba(14,165,233,0.3); } to { box-shadow: 0 4px 22px rgba(14,165,233,0.75); } }

    /* OX 퀴즈 */
    .quiz-word-card {
      background: linear-gradient(135deg, #1e1b4b, #312e81); color: #fff;
      border-radius: 20px; padding: 42px 28px; text-align: center;
      margin-bottom: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); position: relative;
    }
    .quiz-word           { font-size: clamp(1.7rem, 5vw, 2.5rem); font-weight: 800; letter-spacing: 2px; margin-bottom: 6px; }
    .quiz-transliteration{ font-size: 0.92rem; opacity: 0.62; font-style: italic; }
    .quiz-q-num {
      position: absolute; top: 14px; right: 16px;
      background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9);
      font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .quiz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
    .choice-btn {
      padding: 15px 10px; border-radius: 14px; border: 2px solid var(--border);
      background: #fff; color: var(--text); font-size: 0.98rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .choice-btn:hover:not(:disabled) { border-color: var(--primary); background: #ede9fe; color: var(--primary); transform: translateY(-2px); }
    .choice-btn.correct { border-color: var(--green); background: #f0fdf4; color: var(--green); }
    .choice-btn.wrong   { border-color: var(--red);   background: #fef2f2; color: var(--red); }
    .choice-btn:disabled { cursor: not-allowed; }
    .quiz-feedback {
      padding: 11px 14px; border-radius: 14px; margin-bottom: 10px;
      font-size: 0.86rem; font-weight: 600; display: none; line-height: 1.5;
    }
    .quiz-feedback.correct { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; }
    .quiz-feedback.wrong   { background: #fef2f2; color: var(--red);   border: 1px solid #fecaca; }
    .quiz-feedback .fb-verse { margin-top: 5px; font-size: 0.78rem; font-weight: 400; font-style: italic; opacity: 0.85; }

    /* 완료 */
    .complete-screen {
      display: none; text-align: center; background: #fff;
      border-radius: 20px; padding: 44px 28px;
      border: 1px solid var(--border); box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    }
    .complete-emoji  { font-size: 58px; margin-bottom: 14px; }
    .complete-title  { font-size: 1.7rem; font-weight: 900; margin-bottom: 6px; }
    .complete-stars  { font-size: 1.8rem; margin: 14px 0 6px; }
    .complete-score  { font-size: 2.6rem; font-weight: 900; color: var(--primary); margin-bottom: 6px; }
    .complete-score-sub { color: var(--sub); margin-bottom: 24px; }

    /* 단어 목록 */
    .word-list-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--sub); margin-bottom: 10px; }
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 7px; }
    .word-chip {
      background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 9px 12px; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer; transition: all 0.2s;
    }
    .word-chip:hover { border-color: var(--primary); background: #f5f3ff; }
    .w-orig { font-weight: 700; font-size: 0.92rem; }
    .w-mean { color: var(--sub); font-size: 0.73rem; margin-top: 1px; }
    .w-kr   { font-size: 0.92rem; font-weight: 700; }

    /* ── 대조 성경 (양피지) ── */
    .compare-filters { display: flex; gap: 7px; margin-bottom: 16px; flex-wrap: wrap; }
    .cf-btn {
      padding: 6px 16px; border-radius: 3px;
      border: 1.5px solid #8b6914;
      background: #f5edcc; color: #4a3014;
      font-size: 0.82rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.3px;
    }
    .cf-btn:hover  { background: #e8d690; }
    .cf-btn.active { background: #8b6914; color: #f5edcc; border-color: #5c4308; }

    .compare-card {
      /* 가로 줄 — 오래된 원고 노트 느낌 */
      background:
        repeating-linear-gradient(
          0deg,
          transparent, transparent 30px,
          rgba(139,105,20,0.07) 30px, rgba(139,105,20,0.07) 31px
        ),
        linear-gradient(160deg, #f5edcc 0%, #ead9a4 55%, #f0e3bc 100%);
      border: 2px solid #8b6914;
      border-radius: 3px;
      overflow: hidden; margin-bottom: 18px;
      box-shadow:
        4px 4px 0 #c9a855,
        0 6px 24px rgba(100, 70, 10, 0.18),
        inset 0 0 60px rgba(139,105,20,0.06);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .compare-card:hover {
      transform: translateY(-2px);
      box-shadow:
        5px 6px 0 #c9a855,
        0 12px 32px rgba(100,70,10,0.22),
        inset 0 0 60px rgba(139,105,20,0.06);
    }

    .compare-header {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 16px;
      border-bottom: 1px solid #a07828;
      background: linear-gradient(to right, #d9c080, #e8d490, #dfc070);
    }
    .compare-ref {
      font-weight: 800; font-size: 0.9rem;
      color: #2c1a08;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.2px;
    }
    .compare-topic {
      background: #5c3d0a; color: #f5edcc;
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 2px;
      letter-spacing: 0.5px;
    }
    .compare-type {
      margin-left: auto; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 2px;
      letter-spacing: 0.5px;
    }
    .type-ot { background: #6b3d10; color: #f5e8c8; }
    .type-nt { background: #1e3a2e; color: #c8e8d0; }

    .compare-pair { display: grid; grid-template-columns: 1fr 1fr; }

    /* 라틴어 — 짙은 양가죽(vellum) */
    .compare-latin {
      background: linear-gradient(150deg, #2a160a 0%, #3d2010 60%, #281408 100%);
      color: #e8d5a0; padding: 20px 18px;
      position: relative;
    }
    .compare-latin::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent, transparent 3px,
        rgba(255,220,120,0.02) 3px, rgba(255,220,120,0.02) 6px
      );
      pointer-events: none;
    }

    /* 한국어 — 밝은 양피지 */
    .compare-korean {
      background: linear-gradient(150deg, #f5f0df 0%, #ede5c8 60%, #f2ead5 100%);
      padding: 20px 18px; border-left: 1px solid #a07828;
    }

    .cp-label {
      font-size: 9px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase;
      margin-bottom: 10px; display: flex; align-items: center; gap: 5px;
      font-family: 'Georgia', serif;
    }
    .compare-latin  .cp-label { color: rgba(232,213,160,0.5); }
    .compare-korean .cp-label { color: #8b6914; }

    .cp-text {
      font-size: 0.88rem; line-height: 1.9;
      font-family: 'Georgia', 'Times New Roman', serif;
    }
    .compare-latin  .cp-text { color: #f0e4c0; font-style: italic; }
    .compare-korean .cp-text { color: #2a160a; }

    .compare-note {
      padding: 10px 18px;
      background: linear-gradient(to right, #d9c070, #e8d490, #dfc070);
      border-top: 1px solid #a07828;
      font-size: 0.75rem; color: #4a2e08; line-height: 1.55;
      font-family: 'Georgia', serif; font-style: italic;
    }

    /* ── 문장 학습 ── */
    .sentence-card {
      background: #fff; border: 1px solid var(--border); border-radius: 16px;
      padding: 22px 20px; margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .sv-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sv-ref  { font-size: 0.8rem; color: var(--sub); font-weight: 600; }
    .sv-qnum { font-size: 0.8rem; color: var(--sub); }
    .sv-verse {
      font-size: 1.05rem; line-height: 1.85; color: var(--text);
      margin-bottom: 14px; padding: 14px 16px;
      background: #f8fafc; border-radius: 10px; border-left: 3px solid var(--primary);
    }
    .sv-blank {
      display: inline-block; min-width: 60px; border-bottom: 3px solid var(--primary);
      font-weight: 800; color: var(--primary); padding: 0 4px;
      animation: blink-border 1.2s infinite;
    }
    @keyframes blink-border {
      0%,100% { border-color: var(--primary); }
      50%      { border-color: #a5b4fc; }
    }
    .sv-prompt {
      font-size: 0.88rem; color: var(--sub); margin-bottom: 14px; font-weight: 500;
    }
    .sv-choice {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px; border-radius: 12px; margin-bottom: 9px;
      border: 2px solid var(--border); background: #fff; cursor: pointer;
      transition: all 0.2s; text-align: left; width: 100%;
    }
    .sv-choice:hover { border-color: var(--primary); background: #f5f3ff; }
    .sv-choice .choice-word { font-size: 1.05rem; font-weight: 700; flex: 1; }
    .sv-choice .choice-tl   { font-size: 0.78rem; color: var(--sub); }
    .sv-choice.correct  { border-color: #16a34a; background: #f0fdf4; }
    .sv-choice.wrong    { border-color: #dc2626; background: #fef2f2; }
    .sv-choice.disabled { cursor: default; pointer-events: none; }
    .sv-reveal {
      margin-top: 12px; padding: 12px 16px; border-radius: 10px;
      background: #fef2f2; color: var(--red); font-size: 0.85rem; line-height: 1.6;
      display: none;
    }
    .sv-reveal.show { display: block; }

    /* ── 정답 팝업 ── */
    .sent-popup-overlay {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(15, 23, 42, 0.55);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: popFadeIn 0.18s ease;
    }
    @keyframes popFadeIn { from { opacity: 0; } to { opacity: 1; } }

    .sent-popup {
      background: #fff; border-radius: 24px;
      padding: 36px 26px 26px; text-align: center;
      max-width: 360px; width: 100%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.22);
      animation: popScaleIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative; overflow: hidden;
    }
    @keyframes popScaleIn {
      from { transform: scale(0.72); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    .popup-timer {
      position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: #e2e8f0; border-radius: 24px 24px 0 0;
    }
    .popup-timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), #4ade80);
      animation: popTimer 2.5s linear forwards;
    }
    @keyframes popTimer { from { width: 100%; } to { width: 0%; } }

    .popup-icon  { font-size: 54px; margin-bottom: 2px; }
    .popup-label { font-size: 1.7rem; font-weight: 900; color: #16a34a; margin-bottom: 16px; }
    .popup-word  {
      font-size: 2.2rem; font-weight: 800; color: var(--primary);
      letter-spacing: 2px; margin-bottom: 4px;
    }
    .popup-tl    { font-size: 0.88rem; color: var(--sub); font-style: italic; margin-bottom: 10px; }
    .popup-kr    { font-size: 1.15rem; font-weight: 800; color: var(--text); margin-bottom: 3px; }
    .popup-sub   { font-size: 0.8rem; color: var(--sub); margin-bottom: 16px; }
    .popup-verse {
      font-size: 0.8rem; color: var(--sub); font-style: italic;
      background: #f8fafc; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 20px; line-height: 1.65; text-align: left;
      border-left: 3px solid var(--primary);
    }
    .popup-verse-ref { font-size: 0.75rem; font-weight: 700; color: var(--primary); margin-top: 5px; font-style: normal; display: block; }
    .popup-next {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      color: #fff; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(79,70,229,0.3);
    }
    .popup-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,70,229,0.4); }

    /* ── 반응형 (태블릿 이하) ── */
    @media (max-width: 640px) {
      header { padding: 12px 4%; gap: 6px; }
      .header-title { font-size: 1rem; }
      .header-icon  { font-size: 26px; }
      .back-link    { font-size: 0.72rem; padding: 5px 8px; }

      .container { padding: 16px 12px 50px; }

      /* 언어 탭 */
      .lang-tab { font-size: 0.74rem; gap: 3px; padding: 9px 3px; }

      /* 모드 탭 — 가로 스크롤 (탭이 5개라 화면 밖으로 넘침 방지) */
      .mode-tabs {
        overflow-x: auto; -webkit-overflow-scrolling: touch;
        scrollbar-width: none; flex-wrap: nowrap;
        padding-bottom: 3px; margin-bottom: 14px;
      }
      .mode-tabs::-webkit-scrollbar { display: none; }
      .mode-tab { white-space: nowrap; flex-shrink: 0; padding: 7px 12px; font-size: 0.79rem; }

      /* 진도 — 세로 쌓기 */
      .progress-bar-wrap { flex-direction: column; gap: 10px; padding: 12px 14px; }
      .progress-stats { gap: 18px; justify-content: center; width: 100%; }
      .progress-right { width: 100%; }

      /* 플래시카드 */
      .flashcard, .card-face { min-height: 260px; }
      .card-face { padding: 22px 16px; }
      .card-word { font-size: clamp(1.5rem, 8vw, 2.4rem); }
      .card-verse-text { font-size: 0.7rem; }

      /* 버튼 */

// ── TTS 안내 문구 ──
const ttsNotes = {
  greek:   '※ 코이네 헬라어 전용 TTS 없음 — 발음기호를 영어로 읽습니다',
  hebrew:  '※ 히브리어 발음 (Web Speech API)',
  latin:   '※ 라틴어 발음 — 이탈리아어 음성 근사 (Web Speech API)',
  english: '※ 영어 발음 (Web Speech API)',
};

// ── 언어 설정 ──
function setLang(lang) {
  currentLang = lang;
  ['greek','hebrew','latin','english'].forEach(l =>
    document.getElementById('tab-' + l).classList.toggle('active', l === lang)
  );
  setTtsNote(lang);
  resetAll();
  renderMode();
}

function setTtsNote(lang) {
  const note = ttsNotes[lang] || '';
  ['ttsNote','ttsNoteQuiz','ttsNoteSent'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = note;
  });
}

// ── 모드 설정 ──
function setMode(mode) {
  currentMode = mode;
  ['flash','quiz','list','compare','sentence'].forEach(m =>
    document.getElementById('mode-' + m).classList.toggle('active', m === mode)
  );
  resetAll();
  renderMode();
}

function resetAll() {
  cardIndex = 0; isFlipped = false;
  quizIndex = 0; quizScore = 0; quizStreak = 0;
  quizAnswered = false; flashVisited = new Set();
  quizOrder = shuffleArray([...Array(words().length).keys()]);
  sentIdx = 0; sentScore = 0; sentStreak = 0; sentAnswered = false;
  sentOrder = shuffleArray([...Array(words().length).keys()]);
  updateProgress(0, words().length, 0, 0);
}

function words() { return vocab[currentLang]; }

function renderMode() {
  const isFlash    = currentMode === 'flash';
  const isQuiz     = currentMode === 'quiz';
  const isList     = currentMode === 'list';
  const isCompare  = currentMode === 'compare';
  const isSentence = currentMode === 'sentence';
  document.getElementById('flashArea').style.display      = isFlash    ? '' : 'none';
  document.getElementById('quizArea').style.display       = isQuiz     ? '' : 'none';
  document.getElementById('listArea').style.display       = isList     ? '' : 'none';
  document.getElementById('compareArea').style.display    = isCompare  ? '' : 'none';
  document.getElementById('sentenceArea').style.display   = isSentence ? '' : 'none';
  document.getElementById('progressBar').style.display    = (isList || isCompare) ? 'none' : '';
  document.getElementById('completeScreen').style.display = 'none';
  if (isFlash)    renderFlashcard();
  if (isQuiz)     renderQuiz();
  if (isList)     renderList();
  if (isCompare)  renderCompare('all');
  if (isSentence) renderSentence();
}

// ── 플래시카드 ──
function renderFlashcard() {
  const w = words()[cardIndex];
  const labels = { greek:'Greek', hebrew:'Hebrew', latin:'Latin', english:'English' };
  document.getElementById('cardLangBadge').textContent  = labels[currentLang];
  document.getElementById('cardNumBadge').textContent   = `${cardIndex + 1} / ${words().length}`;
  document.getElementById('cardWord').textContent       = w.word;
  document.getElementById('cardWord').style.direction   = currentLang === 'hebrew' ? 'rtl' : 'ltr';
  document.getElementById('cardTranslit').textContent   = w.translit;
  document.getElementById('cardMeaning').textContent    = w.meaning;
  document.getElementById('cardMeaningSub').textContent = `${w.translit} — ${w.sub}`;
  document.getElementById('cardVerseRef').textContent   = w.verseRef;
  document.getElementById('cardVerseText').textContent  = w.verse;

  document.getElementById('flashcard').classList.remove('flipped');
  isFlipped = false;
  flashVisited.add(cardIndex);
  updateProgress(flashVisited.size, words().length, quizScore, quizStreak);
  document.getElementById('statCard').textContent = cardIndex + 1;
  document.getElementById('prevBtn').disabled = cardIndex === 0;
  document.getElementById('nextBtn').disabled = cardIndex === words().length - 1;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
}

function prevCard() { if (cardIndex > 0) { cardIndex--; renderFlashcard(); } }
function nextCard() {
  if (cardIndex < words().length - 1) { cardIndex++; renderFlashcard(); }
  else showComplete(flashVisited.size, words().length);
}

// ── OX 퀴즈 ──
function renderQuiz() {
  document.getElementById('completeScreen').style.display = 'none';
  document.getElementById('quizArea').style.display = '';
  if (quizIndex >= words().length) { showComplete(quizScore, words().length); return; }

  const w = words()[quizOrder[quizIndex]];
  document.getElementById('quizWord').textContent      = w.word;
  document.getElementById('quizWord').style.direction  = currentLang === 'hebrew' ? 'rtl' : 'ltr';
  document.getElementById('quizTranslit').textContent  = w.translit;
  document.getElementById('quizQNum').textContent      = `${quizIndex + 1} / ${words().length}`;

  const fb = document.getElementById('quizFeedback');
  fb.style.display = 'none'; fb.className = 'quiz-feedback';

  const el = document.getElementById('quizChoices');
  el.innerHTML = '';
  quizAnswered = false;
  generateChoices(quizOrder[quizIndex]).forEach(c => {
    const btn = document.createElement('button');
    btn.className   = 'choice-btn';
    btn.textContent = c.meaning;
    btn.onclick     = () => answerQuiz(c.correct, btn, quizOrder[quizIndex]);
    el.appendChild(btn);
  });

  updateProgress(quizIndex, words().length, quizScore, quizStreak);
}

function generateChoices(correctIdx) {
  const all = words();
  const wrong = all.filter((_, i) => i !== correctIdx);
  const picks = shuffleArray(wrong).slice(0, 3).map(w => ({ meaning: w.meaning, correct: false }));
  return shuffleArray([...picks, { meaning: all[correctIdx].meaning, correct: true }]);
}

function answerQuiz(isCorrect, clickedBtn, wIdx) {
  if (quizAnswered) return;
  quizAnswered = true;
  const w = words()[wIdx];

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === w.meaning) b.classList.add('correct');
  });
  if (!isCorrect) { clickedBtn.classList.add('wrong'); quizStreak = 0; }
  else            { quizScore++; quizStreak++; }

  const fb = document.getElementById('quizFeedback');
  fb.className = 'quiz-feedback ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = (isCorrect ? '✅ 정답! ' : '❌ 틀렸어요. ')
    + `"${w.word}" (${w.translit}) = ${w.meaning}`
    + `<div class="fb-verse">${w.verseRef} ${w.verse}</div>`;
  fb.style.display = 'block';

  quizIndex++;
  setTimeout(renderQuiz, 2000);
}

// ── 단어 목록 ──
function renderList() {
  const labels = { greek:'헬라어', hebrew:'히브리어', latin:'라틴어', english:'영어' };
  document.getElementById('listTitle').textContent = `${labels[currentLang]} 단어 목록 (20개)`;
  const grid = document.getElementById('wordGrid');
  grid.innerHTML = '';
  words().forEach((w, i) => {
    const chip = document.createElement('div');
    chip.className = 'word-chip';
    chip.innerHTML = `
      <div>
        <div class="w-orig" style="direction:${currentLang === 'hebrew' ? 'rtl' : 'ltr'}">${w.word}</div>
        <div class="w-mean">${w.translit}</div>
      </div>
      <div class="w-kr">${w.meaning}</div>`;
    chip.onclick = () => { setMode('flash'); cardIndex = i; renderFlashcard(); };
    grid.appendChild(chip);
  });
}

// ── 문장 학습 ──
function renderSentence() {
  if (sentIdx >= words().length) {
    showComplete(sentScore, words().length);
    return;
  }
  const w    = words()[sentOrder[sentIdx]];
  const raw  = w.verse.replace(/["""]/g, '').trim();

  // 빈칸: w.meaning을 ___ 로 교체 (첫 번째만)
  const blanked = raw.replace(w.meaning, '<span class="sv-blank">___</span>');

  document.getElementById('svRef').textContent   = w.verseRef;
  document.getElementById('svQNum').textContent  = `${sentIdx + 1} / ${words().length}`;
  document.getElementById('svVerse').innerHTML   = blanked === raw
    ? `<span class="sv-blank">___</span> — <em style="color:var(--sub);font-size:.85em">${raw}</em>`
    : blanked;

  const langLabel = { greek:'헬라어', hebrew:'히브리어', latin:'라틴어', english:'영어' }[currentLang];
  document.getElementById('svPrompt').textContent = `빈칸 "${w.meaning}"에 해당하는 ${langLabel} 단어는?`;

  document.getElementById('svReveal').className  = 'sv-reveal';
  document.getElementById('svReveal').innerHTML  = '';

  const choices = makeSentChoices(sentOrder[sentIdx]);
  const box = document.getElementById('svChoices');
  box.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'sv-choice';
    btn.innerHTML = `<span class="choice-word" style="direction:${currentLang==='hebrew'?'rtl':'ltr'}">${c.word}</span><span class="choice-tl">${c.translit}</span>`;
    btn.onclick = function() { answerSent(c.correct, sentOrder[sentIdx], this); };
    box.appendChild(btn);
  });
  sentAnswered = false;
  updateProgress(sentIdx, words().length, sentScore, sentStreak);
}

function makeSentChoices(correctIdx) {
  const all   = words();
  const wrong = all.filter((_, i) => i !== correctIdx);
  const picks = shuffleArray(wrong).slice(0, 3).map(w => ({ word: w.word, translit: w.translit, correct: false }));
  return shuffleArray([...picks, { word: all[correctIdx].word, translit: all[correctIdx].translit, correct: true }]);
}

function answerSent(isCorrect, wordIdx, clickedBtn) {
  if (sentAnswered) return;
  sentAnswered = true;
  const w = words()[wordIdx];

  // 버튼 색칠
  document.querySelectorAll('.sv-choice').forEach(btn => {
    btn.classList.add('disabled');
    const bWord = btn.querySelector('.choice-word').textContent.trim();
    if (bWord === w.word) btn.classList.add('correct');
  });
  if (!isCorrect && clickedBtn) clickedBtn.classList.add('wrong');

  if (isCorrect) {
    sentScore++; sentStreak++;
    updateProgress(sentIdx + 1, words().length, sentScore, sentStreak);
    showCorrectPopup(w, () => { sentIdx++; renderSentence(); });
  } else {
    sentStreak = 0;
    const reveal = document.getElementById('svReveal');
    reveal.innerHTML = `❌ 정답: <strong>${w.word}</strong> (${w.translit}) = ${w.meaning} — ${w.sub}`;
    reveal.className = 'sv-reveal show';
    updateProgress(sentIdx + 1, words().length, sentScore, sentStreak);
    setTimeout(() => { sentIdx++; renderSentence(); }, 1900);
  }
}

function showCorrectPopup(w, callback) {
  const overlay = document.createElement('div');
  overlay.className = 'sent-popup-overlay';
  const verseClean = w.verse.replace(/["""]/g, '').trim();
  overlay.innerHTML = `
    <div class="sent-popup">
      <div class="popup-timer"><div class="popup-timer-fill"></div></div>
      <div class="popup-icon">🎉</div>
      <div class="popup-label">정답!</div>
      <div class="popup-word" style="direction:${currentLang==='hebrew'?'rtl':'ltr'}">${w.word}</div>
      <div class="popup-tl">${w.translit}</div>
      <div class="popup-kr">${w.meaning}</div>
      <div class="popup-sub">${w.sub}</div>
      <div class="popup-verse">
        "${verseClean}"
        <span class="popup-verse-ref">${w.verseRef}</span>
      </div>
      <button class="popup-next">다음 문제 →</button>
    </div>`;

  let done = false;
  const dismiss = () => {
    if (done) return;
    done = true;
    overlay.style.opacity = '0';
    overlay.style.transition = 'opacity 0.15s';
    setTimeout(() => { overlay.remove(); callback(); }, 150);
  };

  overlay.querySelector('.popup-next').addEventListener('click', dismiss);
  overlay.addEventListener('click', e => { if (e.target === overlay) dismiss(); });
  document.body.appendChild(overlay);
  setTimeout(dismiss, 2500);
}

// ── TTS (Web Speech API) ──
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

function speakWord() {
  if (!('speechSynthesis' in window)) {
    alert('브라우저가 TTS를 지원하지 않습니다.');
    return;
  }

  const w = currentWord();
  if (!w) return;

  const btnId = currentMode === 'quiz' ? 'ttsBtnQuiz' : currentMode === 'sentence' ? 'ttsBtnSent' : 'ttsBtn';
  const btn = document.getElementById(btnId);
  const stopAnim = () => { if (btn) btn.classList.remove('speaking'); };
  if (btn) btn.classList.add('speaking');

  const utter = new SpeechSynthesisUtterance();
  utter.rate  = 0.78;
  utter.pitch = 1;

  // 모바일에서 he-IL / it-IT 음성이 없을 경우 en-US 로 fallback
  const langMap = { hebrew: 'he-IL', latin: 'it-IT', english: 'en-US' };

  if (currentLang === 'greek') {
    utter.text = w.translit;
    utter.lang = 'en-US';
  } else {
    utter.text = w.word;
    utter.lang = langMap[currentLang] || 'en-US';
  }

  utter.onend   = stopAnim;
  utter.onerror = (e) => {
    // 음성 없음 오류 시 영어 발음기호로 재시도
    if (e.error === 'language-unavailable' || e.error === 'voice-unavailable') {
      const fallback = new SpeechSynthesisUtterance(w.translit || w.word);
      fallback.lang = 'en-US';
      fallback.rate = 0.78;
      fallback.onend = stopAnim;
      fallback.onerror = stopAnim;
      window.speechSynthesis.speak(fallback);
    } else {
      stopAnim();
    }
  };

  if (isIOS) {
    // iOS: cancel() 직후 speak()가 무시되는 버그 → resume() 후 speak()
    window.speechSynthesis.cancel();
    window.speechSynthesis.resume();
    window.speechSynthesis.speak(utter);
  } else {
    // Android / Desktop: cancel 후 짧은 딜레이
    window.speechSynthesis.cancel();
    setTimeout(() => window.speechSynthesis.speak(utter), 80);
  }
}

function currentWord() {
  if (currentMode === 'quiz') return words()[quizOrder[Math.min(quizIndex, words().length - 1)]];
  return words()[cardIndex];
}

// ── 완료 화면 ──
function showComplete(score, total) {
  document.getElementById('flashArea').style.display      = 'none';
  document.getElementById('quizArea').style.display       = 'none';
  document.getElementById('progressBar').style.display    = 'none';
  const el = document.getElementById('completeScreen');
  el.style.display = 'block';
  const pct = Math.round((score / total) * 100);
  document.getElementById('completeStars').textContent    = pct >= 80 ? '⭐⭐⭐' : pct >= 50 ? '⭐⭐' : '⭐';
  document.getElementById('completeScore').textContent    = `${score} / ${total}`;
  document.getElementById('completeScoreSub').textContent = `정답률 ${pct}% — ${pct >= 80 ? '훌륭해요!' : pct >= 50 ? '잘했어요!' : '계속 연습해 보세요!'}`;
}

function restartCurrent() {
  resetAll();
  document.getElementById('completeScreen').style.display = 'none';
  document.getElementById('progressBar').style.display    = '';
  renderMode();
}

function updateProgress(current, total, score, streak) {
  const pct = total > 0 ? Math.round((current / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent  = pct + '%';
  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statScore').textContent    = score;
  document.getElementById('statStreak').textContent   = streak;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 초기화
resetAll();
renderMode();
setTtsNote(currentLang);
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>틱택토 🎮</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', 'Segoe UI', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #EC4899 0%, #8B5CF6 50%, #6366F1 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: white;
  border-radius: 28px;
  padding: 36px 32px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 24px 64px rgba(0,0,0,0.14);
  animation: fadeUp 0.4s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.title-icon { font-size: 52px; text-align: center; margin-bottom: 6px; }
.title { font-size: 26px; font-weight: 900; text-align: center; color: #1a1a1a; margin-bottom: 4px; }
.subtitle { font-size: 14px; text-align: center; color: #888; margin-bottom: 20px; }

.mode-tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #f5f5f7; border-radius: 14px; padding: 5px; }
.mode-tab {
  flex: 1; padding: 10px; border: none; background: transparent; border-radius: 10px;
  font-size: 13px; font-weight: 700; color: #888; cursor: pointer; transition: all .2s; font-family: inherit;
}
.mode-tab.active { background: white; color: #8B5CF6; box-shadow: 0 2px 8px rgba(0,0,0,.08); }

.status { text-align: center; font-size: 16px; font-weight: 800; color: #1a1a1a; margin-bottom: 16px; min-height: 22px; }
.status .turn-x { color: #EC4899; }
.status .turn-o { color: #6366F1; }

.board {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin-bottom: 20px; aspect-ratio: 1;
}
.cell {
  background: #fafafa; border: none; border-radius: 14px;
  font-size: 42px; font-weight: 900; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .15s;
  color: #1a1a1a;
}
.cell:hover:not(:disabled) { background: #f0eefe; transform: translateY(-2px); }
.cell:disabled { cursor: default; }
.cell.x { color: #EC4899; }
.cell.o { color: #6366F1; }
.cell.win { background: #ecfdf5; animation: pop .3s ease; }
@keyframes pop { from { transform: scale(0.85); } to { transform: scale(1); } }

.score-row { display: flex; gap: 10px; margin-bottom: 18px; }
.score-box { flex: 1; text-align: center; background: #fafafa; border-radius: 12px; padding: 10px 6px; }
.score-num { font-size: 20px; font-weight: 900; }
.score-num.x { color: #EC4899; }
.score-num.o { color: #6366F1; }
.score-num.draw { color: #888; }
.score-lbl { font-size: 11px; color: #aaa; margin-top: 2px; }

.btn-group { display: flex; gap: 10px; }
.btn-reset, .btn-reset-score {
  flex: 1; padding: 13px; border: none; border-radius: 14px;
  font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  transition: transform .2s;
}
.btn-reset { background: linear-gradient(135deg, #EC4899, #8B5CF6); color: white; }
.btn-reset:hover { transform: translateY(-2px); }
.btn-reset-score { background: #f2f2f2; color: #666; }
.btn-reset-score:hover { background: #e5e5e5; }

.back-btn {
  position: fixed; top: 18px; left: 18px;
  background: white; border: none; border-radius: 50%;
  width: 44px; height: 44px; font-size: 20px;
  cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s;
}
.back-btn:hover { transform: scale(1.1); }

@media (max-width: 420px) {
  .card { padding: 28px 20px; }
  .cell { font-size: 34px; }
}
</style>
</head>
<body>
<button class="back-btn" onclick="location.href='../index.html'" title="포트폴리오로 돌아가기">←</button>

<div class="card">
  <div class="title-icon">🎮</div>
  <div class="title">틱택토</div>
  <div class="subtitle">3x3 칸에 먼저 한 줄을 완성하면 승리!</div>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tabPvp" onclick="setMode('pvp')">사람과 대결</button>
    <button class="mode-tab" id="tabAi" onclick="setMode('ai')">컴퓨터와 대결</button>
  </div>

  <div class="status" id="status">X 차례입니다</div>

  <div class="board" id="board"></div>

  <div class="score-row">
    <div class="score-box"><div class="score-num x" id="scoreX">0</div><div class="score-lbl">X 승</div></div>
    <div class="score-box"><div class="score-num draw" id="scoreDraw">0</div><div class="score-lbl">무승부</div></div>
    <div class="score-box"><div class="score-num o" id="scoreO">0</div><div class="score-lbl">O 승</div></div>
  </div>

  <div class="btn-group">
    <button class="btn-reset" onclick="newRound()">🔄 새 게임</button>
    <button class="btn-reset-score" onclick="resetScore()">점수 초기화</button>
  </div>
</div>

<script>
const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

let board = Array(9).fill(null);
let current = 'X';
let mode = 'pvp'; // 'pvp' | 'ai'
let gameOver = false;
let score = { X: 0, O: 0, draw: 0 };

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');

function loadScore() {
  const saved = localStorage.getItem('tictactoe-score');
  if (saved) score = JSON.parse(saved);
  renderScore();
}
function saveScore() {
  localStorage.setItem('tictactoe-score', JSON.stringify(score));
}
function renderScore() {
  document.getElementById('scoreX').textContent = score.X;
  document.getElementById('scoreO').textContent = score.O;
  document.getElementById('scoreDraw').textContent = score.draw;
}
function resetScore() {
  score = { X: 0, O: 0, draw: 0 };
  saveScore();
  renderScore();
}

function setMode(m) {
  mode = m;
  document.getElementById('tabPvp').classList.toggle('active', m === 'pvp');
  document.getElementById('tabAi').classList.toggle('active', m === 'ai');
  newRound();
}

function newRound() {
  board = Array(9).fill(null);
  current = 'X';
  gameOver = false;
  renderBoard();
  updateStatus();
}

function renderBoard() {
  boardEl.innerHTML = '';
  board.forEach((val, i) => {
    const btn = document.createElement('button');
    btn.className = 'cell' + (val ? ' ' + val.toLowerCase() : '');
    btn.textContent = val || '';
    btn.disabled = !!val || gameOver;
    btn.onclick = () => handleMove(i);
    boardEl.appendChild(btn);
  });
}

function updateStatus(message) {
  if (message) { statusEl.innerHTML = message; return; }
  const cls = current === 'X' ? 'turn-x' : 'turn-o';
  const label = mode === 'ai' && current === 'O' ? '컴퓨터' : current;
  statusEl.innerHTML = `<span class="${cls}">${label}</span> 차례입니다`;
}

function handleMove(i) {
  if (board[i] || gameOver) return;
  if (mode === 'ai' && current === 'O') return; // AI 차례엔 클릭 무시

  place(i, current);

  if (checkEnd()) return;

  current = current === 'X' ? 'O' : 'X';
  renderBoard();
  updateStatus();

  if (mode === 'ai' && current === 'O' && !gameOver) {
    statusEl.innerHTML = `<span class="turn-o">컴퓨터</span>가 생각 중...`;
    setTimeout(() => {
      const move = bestMove();
      if (move !== -1) {
        place(move, 'O');
        if (!checkEnd()) {
          current = 'X';
          renderBoard();
          updateStatus();
        }
      }
    }, 400);
  }
}

function place(i, player) {
  board[i] = player;
}

function checkEnd() {
  const line = getWinLine();
  if (line) {
    gameOver = true;
    renderBoard();
    line.forEach(i => boardEl.children[i].classList.add('win'));
    const winnerLabel = mode === 'ai' && current === 'O' ? '컴퓨터' : current;
    updateStatus(`🎉 <span class="${current === 'X' ? 'turn-x' : 'turn-o'}">${winnerLabel}</span> 승리!`);
    score[current]++;
    saveScore();
    renderScore();
    return true;
  }
  if (board.every(c => c)) {
    gameOver = true;
    renderBoard();
    updateStatus('🤝 무승부입니다');
    score.draw++;
    saveScore();
    renderScore();
    return true;
  }
  return false;
}

function getWinLine() {
  for (const line of WIN_LINES) {
    const [a, b, c] = line;
    if (board[a] && board[a] === board[b] && board[b] === board[c]) return line;
  }
  return null;
}

// ── 미니맥스 AI (절대 지지 않음) ──
function bestMove() {
  let best = { score: -Infinity, index: -1 };
  for (let i = 0; i < 9; i++) {
    if (!board[i]) {
      board[i] = 'O';
      const s = minimax(board, 0, false);
      board[i] = null;
      if (s > best.score) best = { score: s, index: i };
    }
  }
  return best.index;
}

function minimax(b, depth, isMaximizing) {
  const line = getWinLineFor(b);
  if (line) return b[line[0]] === 'O' ? 10 - depth : depth - 10;
  if (b.every(c => c)) return 0;

  if (isMaximizing) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = 'O';
        best = Math.max(best, minimax(b, depth + 1, false));
        b[i] = null;
      }
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = 'X';
        best = Math.min(best, minimax(b, depth + 1, true));
        b[i] = null;
      }
    }
    return best;
  }
}

function getWinLineFor(b) {
  for (const line of WIN_LINES) {
    const [a, c, d] = line;
    if (b[a] && b[a] === b[c] && b[c] === b[d]) return line;
  }
  return null;
}

loadScore();
newRound();
</script>
</body>
</html>

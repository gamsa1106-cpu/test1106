<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>계산기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1a1a2e;
      font-family: Arial, sans-serif;
    }

    .calculator {
      background-color: #16213e;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 300px;
    }

    .display {
      background-color: #0f3460;
      border-radius: 10px;
      padding: 16px;
      text-align: right;
      margin-bottom: 20px;
    }

    .display .expression {
      color: #a0aec0;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display .result {
      color: #ffffff;
      font-size: 36px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:active {
      transform: scale(0.95);
      opacity: 0.8;
    }

    .btn-number {
      background-color: #1a1a4e;
      color: #ffffff;
    }

    .btn-operator {
      background-color: #e94560;
      color: #ffffff;
    }

    .btn-equal {
      background-color: #e94560;
      color: #ffffff;
      grid-column: span 2;
    }

    .btn-clear {
      background-color: #533483;
      color: #ffffff;
      grid-column: span 2;
    }

    .btn-dot {
      background-color: #1a1a4e;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearAll()">C</button>
      <button class="btn-operator" onclick="deleteLast()">⌫</button>
      <button class="btn-operator" onclick="appendToInput('%')">%</button>

      <button class="btn-number" onclick="appendToInput('7')">7</button>
      <button class="btn-number" onclick="appendToInput('8')">8</button>
      <button class="btn-number" onclick="appendToInput('9')">9</button>
      <button class="btn-operator" onclick="appendToInput('/')">÷</button>

      <button class="btn-number" onclick="appendToInput('4')">4</button>
      <button class="btn-number" onclick="appendToInput('5')">5</button>
      <button class="btn-number" onclick="appendToInput('6')">6</button>
      <button class="btn-operator" onclick="appendToInput('*')">×</button>

      <button class="btn-number" onclick="appendToInput('1')">1</button>
      <button class="btn-number" onclick="appendToInput('2')">2</button>
      <button class="btn-number" onclick="appendToInput('3')">3</button>
      <button class="btn-operator" onclick="appendToInput('-')">−</button>

      <button class="btn-number" onclick="appendToInput('0')">0</button>
      <button class="btn-dot" onclick="appendToInput('.')">.</button>
      <button class="btn-operator" onclick="appendToInput('+')">+</button>

      <button class="btn-equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let input = '';

    // 숫자에 3자리마다 콤마 추가 (예: 3000 → 3,000)
    function formatNumber(numStr) {
      if (!numStr) return '';
      const parts = numStr.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return parts.join('.');
    }

    // 수식 전체를 보기 좋게 변환 (숫자 콤마 + 연산자 기호)
    function formatExpression(str) {
      let result = '';
      let numBuf = '';
      const ops = ['+', '-', '*', '/', '%'];

      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ops.includes(ch)) {
          if (numBuf) { result += formatNumber(numBuf); numBuf = ''; }
          if (ch === '*') result += ' × ';
          else if (ch === '/') result += ' ÷ ';
          else if (ch === '+') result += ' + ';
          else if (ch === '-') result += ' − ';
          else if (ch === '%') result += '%';
        } else {
          numBuf += ch;
        }
      }
      if (numBuf) result += formatNumber(numBuf);
      return result;
    }

    // 현재 입력 중인 마지막 숫자를 추출
    function getLastNumber(str) {
      const match = str.match(/[\d.]+$/);
      return match ? match[0] : '';
    }

    // 결과 화면 업데이트
    function updateDisplay() {
      document.getElementById('expression').textContent = formatExpression(input);
      const lastNum = getLastNumber(input);
      document.getElementById('result').textContent = lastNum ? formatNumber(lastNum) : (input || '0');
    }

    function appendToInput(value) {
      const operators = ['+', '-', '*', '/'];
      const lastChar = input[input.length - 1];

      if (operators.includes(value) && operators.includes(lastChar)) {
        input = input.slice(0, -1);
      }

      // 소수점 중복 방지
      if (value === '.') {
        const lastNum = getLastNumber(input);
        if (lastNum.includes('.')) return;
      }

      input += value;
      updateDisplay();
    }

    function clearAll() {
      input = '';
      document.getElementById('expression').textContent = '';
      document.getElementById('result').textContent = '0';
    }

    function deleteLast() {
      input = input.slice(0, -1);
      updateDisplay();
    }

    function calculate() {
      if (!input) return;

      try {
        const expression = input.replace(/%/g, '/100');
        const answer = eval(expression);

        document.getElementById('expression').textContent = formatExpression(input) + ' =';

        // 소수점 처리: 정수면 정수로, 아니면 최대 10자리에서 불필요한 0 제거
        const answerStr = Number.isInteger(answer)
          ? String(answer)
          : parseFloat(answer.toFixed(10)).toString();

        document.getElementById('result').textContent = formatNumber(answerStr);
        input = String(answer);
      } catch (e) {
        document.getElementById('result').textContent = '오류';
        input = '';
      }
    }

    document.addEventListener('keydown', function(event) {
      const key = event.key;
      if (key >= '0' && key <= '9') appendToInput(key);
      else if (key === '+') appendToInput('+');
      else if (key === '-') appendToInput('-');
      else if (key === '*') appendToInput('*');
      else if (key === '/') { event.preventDefault(); appendToInput('/'); }
      else if (key === '%') appendToInput('%');
      else if (key === '.') appendToInput('.');
      else if (key === 'Enter' || key === '=') calculate();
      else if (key === 'Backspace') deleteLast();
      else if (key === 'Escape') clearAll();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이탈리아어 학습 | 문법 · 단어 · 회화 · 패턴 · 발음 · 퀴즈</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:  #008C45;
    --green2: #00A857;
    --red:    #CD212A;
    --red2:   #E63946;
    --text:   #1e293b;
    --sub:    #64748b;
    --bg:     #f8fafc;
    --card:   #ffffff;
    --border: #e2e8f0;
  }

  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── 국기 스트라이프 ── */
  .flag-stripe { height: 5px; display: flex; }
  .flag-stripe span { flex: 1; }
  .flag-stripe .g { background: var(--green); }
  .flag-stripe .w { background: #ffffff; }
  .flag-stripe .r { background: var(--red); }

  header {
    background: linear-gradient(135deg, #005c2e, var(--green));
    color: #fff; padding: 18px 5%;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .header-center { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .header-icon { font-size: 30px; }
  .header-title { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.5px; }
  .header-sub { font-size: 0.76rem; opacity: 0.8; }
  .back-link {
    justify-self: start; color: rgba(255,255,255,0.9); text-decoration: none;
    font-size: 0.82rem; border: 1px solid rgba(255,255,255,0.4);
    padding: 6px 13px; border-radius: 8px; transition: all 0.2s; white-space: nowrap;
  }
  .back-link:hover { background: rgba(255,255,255,0.15); }

  .container { max-width: 880px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ── 메인 탭 ── */
  .main-tabs {
    display: flex; gap: 5px; margin-bottom: 20px; background: #fff;
    border: 1px solid var(--border); border-radius: 14px; padding: 5px;
    overflow-x: auto;
  }
  .main-tabs::-webkit-scrollbar { display: none; }
  .main-tab {
    flex: 1; min-width: 84px; padding: 10px 6px; border: none; border-radius: 10px;
    font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap;
    background: transparent; color: var(--sub); transition: all 0.2s;
  }
  .main-tab.active { background: linear-gradient(135deg, var(--green), var(--green2)); color: #fff; box-shadow: 0 4px 14px rgba(0,140,69,0.35); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .sub-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .sub-tab {
    padding: 8px 16px; border: 1.5px solid var(--border); border-radius: 30px;
    font-size: 0.84rem; font-weight: 600; cursor: pointer; background: #fff; color: var(--sub); transition: all 0.2s;
  }
  .sub-tab.active { border-color: var(--green); background: #e6f6ee; color: var(--green); }

  .section-desc { color: var(--sub); font-size: 0.88rem; margin-bottom: 16px; line-height: 1.6; }

  /* ── 발음 버튼 ── */
  .speak-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: var(--green); color: #fff; font-size: 14px; cursor: pointer;
    flex-shrink: 0; transition: transform 0.15s, background 0.15s;
  }
  .speak-btn:hover { background: var(--green2); transform: scale(1.08); }
  .speak-btn:active { transform: scale(0.95); }

  /* ── 문법 비교 카드 ── */
  .compare-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
  .compare-title { font-weight: 800; font-size: 0.95rem; margin-bottom: 10px; color: var(--text); }
  .compare-row { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; font-size: 0.88rem; line-height: 1.55; }
  .compare-row .flag-dot { flex-shrink: 0; width: 22px; font-weight: 800; }
  .compare-row.ko .flag-dot { color: var(--sub); }
  .compare-row.it .flag-dot { color: var(--green); }
  .compare-example {
    margin-top: 10px; background: #f8fafc; border-radius: 10px; padding: 10px 14px;
    font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px;
  }
  .compare-example .it-line { color: var(--green); font-weight: 700; }
  .compare-example .ko-line { color: var(--sub); }

  /* ── 품사별 문법 카드 ── */
  .topic-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .topic-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .topic-icon { font-size: 26px; }
  .topic-title { font-size: 1.05rem; font-weight: 800; }
  .topic-explain { color: var(--sub); font-size: 0.87rem; line-height: 1.6; margin-bottom: 14px; }
  .topic-table-row {
    display: flex; gap: 12px; padding: 10px 12px; border-radius: 10px; background: #f8fafc;
    margin-bottom: 6px; font-size: 0.84rem; align-items: baseline; flex-wrap: wrap;
  }
  .topic-table-row .it { font-weight: 700; color: var(--green); }
  .topic-table-row .desc { color: var(--sub); }

  /* ── 단어 카드 ── */
  .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .word-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; display: flex; align-items: center; gap: 12px; transition: box-shadow 0.2s, border-color 0.2s;
  }
  .word-card:hover { border-color: var(--green); box-shadow: 0 6px 18px rgba(0,140,69,0.1); }
  .word-info { flex: 1; min-width: 0; }
  .word-it { font-size: 1.1rem; font-weight: 800; color: var(--text); }
  .word-pron { font-size: 0.76rem; color: var(--sub); font-style: italic; }
  .word-ko { font-size: 0.86rem; color: var(--green); font-weight: 600; margin-top: 2px; }

  /* ── 회화 카드 ── */
  .dialogue-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .dialogue-title { font-weight: 800; font-size: 1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .dialogue-title::before { content: '💬'; }
  .dialogue-line { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--border); }
  .dialogue-line:first-of-type { border-top: none; }
  .speaker-badge {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: 800; color: #fff;
  }
  .speaker-badge.A { background: var(--green); }
  .speaker-badge.B { background: var(--red); }
  .dialogue-text { flex: 1; min-width: 0; }
  .dialogue-it { font-weight: 700; font-size: 0.92rem; }
  .dialogue-ko { font-size: 0.8rem; color: var(--sub); margin-top: 1px; }

  /* ── 패턴 카드 ── */
  .pattern-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .pattern-template {
    font-size: 1.15rem; font-weight: 800; color: var(--red);
    background: #fdeeee; display: inline-block; padding: 6px 14px; border-radius: 10px; margin-bottom: 6px;
  }
  .pattern-ko { color: var(--sub); font-size: 0.86rem; margin-bottom: 12px; }
  .pattern-example {
    display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--border);
  }
  .pattern-example:first-of-type { border-top: none; }
  .pattern-example .txt { flex: 1; min-width: 0; }
  .pattern-example .it { font-weight: 700; font-size: 0.9rem; }
  .pattern-example .ko { font-size: 0.8rem; color: var(--sub); }

  /* ── 발음 규칙 카드 ── */
  .rule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .rule-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .rule-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .rule-name { font-weight: 800; font-size: 0.92rem; }
  .rule-sound { font-size: 0.78rem; font-weight: 700; color: #fff; background: var(--red); padding: 2px 10px; border-radius: 20px; }
  .rule-example { font-size: 0.86rem; color: var(--green); font-weight: 600; margin-bottom: 4px; }
  .rule-note { font-size: 0.78rem; color: var(--sub); line-height: 1.5; }

  /* ── 퀴즈 ── */
  .quiz-intro { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 20px; text-align: center; }
  .quiz-best { font-size: 0.86rem; color: var(--sub); margin: 10px 0 18px; }
  .btn-main {
    padding: 12px 26px; background: linear-gradient(135deg, var(--green), var(--green2)); color: #fff;
    border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
  }
  .quiz-progress { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--sub); margin-bottom: 8px; }
  .quiz-track { height: 7px; background: var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .quiz-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--green2)); transition: width 0.4s; }
  .quiz-question { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px 20px; text-align: center; margin-bottom: 14px; font-size: 1.1rem; font-weight: 700; }
  .quiz-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quiz-choice {
    padding: 14px 10px; border: 1.5px solid var(--border); border-radius: 12px; background: #fff;
    font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .quiz-choice:hover { border-color: var(--green); }
  .quiz-choice.correct { border-color: var(--green); background: #e6f6ee; color: var(--green); }
  .quiz-choice.wrong { border-color: var(--red); background: #fdeeee; color: var(--red); }
  .quiz-result { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px 20px; text-align: center; }
  .quiz-result .score { font-size: 2.2rem; font-weight: 900; color: var(--green); margin: 10px 0; }

  footer { text-align: center; padding: 24px; color: var(--sub); font-size: 0.78rem; }

  /* ── 단어 hover 툴팁 ── */
  .hoverable { border-bottom: 1.5px dotted var(--green); cursor: help; }
  .word-tooltip {
    position: fixed; z-index: 3000; background: #fff; border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 18px; box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    pointer-events: none; text-align: center; max-width: 220px;
  }
  .word-tooltip .tt-emoji { font-size: 34px; margin-bottom: 4px; }
  .word-tooltip .tt-word { font-weight: 800; font-size: 1rem; color: var(--text); }
  .word-tooltip .tt-ko { font-size: 0.86rem; color: var(--green); font-weight: 700; margin-top: 3px; line-height: 1.4; }
  .word-tooltip .tt-pos {
    display: inline-block; margin-top: 7px; font-size: 0.7rem; font-weight: 700;
    color: #fff; background: var(--red); padding: 2px 10px; border-radius: 20px;
  }

  @media (max-width: 640px) {
    .header-title { font-size: 1.05rem; }
    .back-link { font-size: 0.72rem; padding: 5px 8px; }
    .container { padding: 16px 12px 50px; }
    .main-tab { font-size: 0.72rem; padding: 9px 4px; }
    .word-grid { grid-template-columns: 1fr; }
    .quiz-choices { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="flag-stripe"><span class="g"></span><span class="w"></span><span class="r"></span></div>
<header>
  <a href="../index.html" class="back-link">← 포트폴리오로</a>
  <div class="header-center">
    <div class="header-icon">🇮🇹</div>
    <div class="header-title">이탈리아어 학습</div>
    <div class="header-sub">문법 · 단어 · 회화 · 패턴 · 발음 · 퀴즈</div>
  </div>
  <div></div>
</header>

<div class="container">

  <div class="main-tabs">
    <button class="main-tab active" data-tab="grammar" onclick="setMainTab('grammar')">📖 문법</button>
    <button class="main-tab" data-tab="words" onclick="setMainTab('words')">📚 단어</button>
    <button class="main-tab" data-tab="dialogue" onclick="setMainTab('dialogue')">💬 회화</button>
    <button class="main-tab" data-tab="pattern" onclick="setMainTab('pattern')">🔁 패턴</button>
    <button class="main-tab" data-tab="pronun" onclick="setMainTab('pronun')">🔤 발음</button>
    <button class="main-tab" data-tab="quiz" onclick="setMainTab('quiz')">❓ 퀴즈</button>
  </div>

  <!-- ── 1. 문법 ── -->
  <div class="tab-panel active" id="panel-grammar">
    <div class="sub-tabs">
      <button class="sub-tab active" data-sub="compare" onclick="setGrammarSub('compare')">한글 ↔ 이탈리아어 비교</button>
      <button class="sub-tab" data-sub="topics" onclick="setGrammarSub('topics')">품사별 문법</button>
    </div>
    <div id="grammar-compare"></div>
    <div id="grammar-topics" style="display:none"></div>
  </div>

  <!-- ── 2. 단어 ── -->
  <div class="tab-panel" id="panel-words">
    <div class="sub-tabs" id="word-cat-tabs"></div>
    <div class="word-grid" id="word-grid"></div>
  </div>

  <!-- ── 3. 회화 ── -->
  <div class="tab-panel" id="panel-dialogue">
    <div class="sub-tabs">
      <button class="sub-tab active" data-level="beginner" onclick="setDialogueLevel('beginner')">초급</button>
      <button class="sub-tab" data-level="intermediate" onclick="setDialogueLevel('intermediate')">중급</button>
    </div>
    <div id="dialogue-list"></div>
  </div>

  <!-- ── 4. 패턴 학습 ── -->
  <div class="tab-panel" id="panel-pattern">
    <p class="section-desc">문장의 기본 틀(패턴)에 단어만 바꿔 끼우면서 다양한 표현을 익혀보세요.</p>
    <div id="pattern-list"></div>
  </div>

  <!-- ── 5. 발음 규칙 ── -->
  <div class="tab-panel" id="panel-pronun">
    <p class="section-desc">이탈리아어는 철자와 발음이 거의 1:1로 대응하는 표음 언어라, 영어식 파닉스표 대신 아래 "글자 조합 규칙"만 익히면 대부분의 단어를 읽을 수 있어요.</p>
    <div class="rule-grid" id="rule-grid"></div>
  </div>

  <!-- ── 6. 퀴즈 ── -->
  <div class="tab-panel" id="panel-quiz">
    <div id="quiz-area"></div>
  </div>

</div>

<footer>🇮🇹 이탈리아어 학습 · JavaScript로 직접 만든 학습 웹앱</footer>

<div class="word-tooltip" id="wordTooltip" style="display:none"></div>

<script src="data.js"></script>
<script>
// ── TTS 헬퍼 ──
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('이 브라우저는 음성 합성을 지원하지 않아요.'); return; }
  window.speechSynthesis.cancel();
  const cleaned = text.split('(')[0].trim();
  const u = new SpeechSynthesisUtterance(cleaned);
  u.lang = 'it-IT';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
function speakBtn(text) {
  return `<button class="speak-btn" onclick="speak('${text.replace(/'/g, "\\'")}')" title="발음 듣기">🔊</button>`;
}

// ── 단어 hover 툴팁: word + glossary를 합쳐 단어 사전(wordIndex) 구성 ──
const wordCatPos = { noun: '명사', adjective: '형용사', number: '숫자', verb: '동사', greeting: '인사·표현' };
const wordIndex = {};
Object.entries(words).forEach(([cat, list]) => {
  list.forEach(w => {
    wordIndex[w.it.toLowerCase()] = { it: w.it, ko: w.ko, pos: wordCatPos[cat], emoji: w.emoji };
  });
});
Object.entries(glossary).forEach(([key, entry]) => {
  wordIndex[key] = { it: key, ko: entry.ko, pos: entry.pos, emoji: entry.emoji };
});

// 문장을 단어 단위로 쪼개 사전에 있는 단어만 hover 가능한 span으로 감싼다
function tokenize(sentence) {
  return sentence.replace(/[A-Za-zÀ-ÖØ-öø-ÿ']+/g, token => {
    const entry = wordIndex[token.toLowerCase()];
    if (!entry) return token;
    return `<span class="hoverable" data-key="${token.toLowerCase()}">${token}</span>`;
  });
}

// 2초간 정지 상태로 hover하면 단어 툴팁 표시
let hoverTimer = null;
let hoverTarget = null;
document.addEventListener('mouseover', e => {
  const span = e.target.closest('.hoverable');
  if (!span || span === hoverTarget) return;
  if (hoverTimer) clearTimeout(hoverTimer);
  hoverTarget = span;
  hoverTimer = setTimeout(() => showWordTooltip(span), 2000);
});
document.addEventListener('mouseout', e => {
  const span = e.target.closest('.hoverable');
  if (!span || span !== hoverTarget) return;
  if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
  hoverTarget = null;
  hideWordTooltip();
});
function showWordTooltip(span) {
  const entry = wordIndex[span.dataset.key];
  if (!entry) return;
  const tt = document.getElementById('wordTooltip');
  tt.innerHTML = `
    ${entry.emoji ? `<div class="tt-emoji">${entry.emoji}</div>` : ''}
    <div class="tt-word">${entry.it}</div>
    <div class="tt-ko">${entry.ko}</div>
    <span class="tt-pos">${entry.pos}</span>
  `;
  tt.style.display = 'block';
  const rect = span.getBoundingClientRect();
  const ttRect = tt.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - ttRect.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - ttRect.width - 8));
  let top = rect.top - ttRect.height - 10;
  if (top < 8) top = rect.bottom + 10;
  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
}
function hideWordTooltip() {
  document.getElementById('wordTooltip').style.display = 'none';
}

// ── 사운드 이펙트 (Web Audio API) ──
let audioCtx;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, startTime, duration, type = 'sine', gain = 0.15) {
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.value = gain;
  osc.connect(g);
  g.connect(ctx.destination);
  osc.start(ctx.currentTime + startTime);
  osc.stop(ctx.currentTime + startTime + duration);
}
function playCorrectSound() { beep(880, 0, 0.12); beep(1174.66, 0.12, 0.2); }
function playWrongSound() { beep(220, 0, 0.3, 'sawtooth', 0.12); }

// ── 메인 탭 전환 ──
function setMainTab(tab) {
  document.querySelectorAll('.main-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  if (tab === 'quiz' && !quizStarted) renderQuizIntro();
  hideWordTooltip();
}

// ── 1. 문법 ──
function setGrammarSub(sub) {
  document.querySelectorAll('#panel-grammar .sub-tab').forEach(b => b.classList.toggle('active', b.dataset.sub === sub));
  document.getElementById('grammar-compare').style.display = sub === 'compare' ? '' : 'none';
  document.getElementById('grammar-topics').style.display = sub === 'topics' ? '' : 'none';
}
function renderGrammarCompare() {
  const el = document.getElementById('grammar-compare');
  el.innerHTML = grammarCompare.map(g => `
    <div class="compare-card">
      <div class="compare-title">${g.title}</div>
      <div class="compare-row ko"><span class="flag-dot">한글</span><span>${g.ko}</span></div>
      <div class="compare-row it"><span class="flag-dot">IT</span><span>${g.it}</span></div>
      <div class="compare-example">
        <span class="it-line">${g.example.it} ${speakBtn(g.example.it)}</span>
        <span class="ko-line">${g.example.ko}</span>
      </div>
    </div>
  `).join('');
}
function renderGrammarTopics() {
  const el = document.getElementById('grammar-topics');
  el.innerHTML = Object.values(grammarTopics).map(t => `
    <div class="topic-card">
      <div class="topic-head"><span class="topic-icon">${t.icon}</span><span class="topic-title">${t.title}</span></div>
      <div class="topic-explain">${t.explain}</div>
      ${t.table.map(row => `
        <div class="topic-table-row">
          <span class="it">${row.it}</span>
          <span class="desc">${row.desc}</span>
        </div>
      `).join('')}
    </div>
  `).join('');
}

// ── 2. 단어 ──

}

// ── 6. 퀴즈 ──
let quizStarted = false;
let quizPool = [];
let quizIndex = 0;
let quizScore = 0;
const QUIZ_LEN = 15;

function buildWordQuestions() {
  const all = Object.values(words).flat();
  return all.map(w => {
    const wrongPool = all.filter(x => x.ko !== w.ko);
    const wrongs = shuffle(wrongPool).slice(0, 3).map(x => x.ko);
    const choices = shuffle([w.ko, ...wrongs]);
    return { question: `"${w.it}"의 뜻은?`, choices, answer: choices.indexOf(w.ko) };
  });
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function renderQuizIntro() {
  const best = localStorage.getItem('italianQuizBest');
  document.getElementById('quiz-area').innerHTML = `
    <div class="quiz-intro">
      <div style="font-size:40px">❓</div>
      <h3 style="margin:10px 0">단어 · 문법 · 패턴 퀴즈 (${QUIZ_LEN}문제)</h3>
      <div class="quiz-best">${best ? `최고 기록: ${best} / ${QUIZ_LEN}` : '아직 기록이 없어요. 첫 도전을 해보세요!'}</div>
      <button class="btn-main" onclick="startQuiz()">퀴즈 시작하기</button>
    </div>
  `;
}
function startQuiz() {
  quizStarted = true;
  quizIndex = 0;
  quizScore = 0;
  const pool = shuffle([...buildWordQuestions(), ...quizExtra]);
  quizPool = pool.slice(0, QUIZ_LEN);
  showQuizQuestion();
}
function showQuizQuestion() {
  if (quizIndex >= quizPool.length) { showQuizResult(); return; }
  const q = quizPool[quizIndex];
  const pct = Math.round((quizIndex / quizPool.length) * 100);
  document.getElementById('quiz-area').innerHTML = `
    <div class="quiz-progress"><span>${quizIndex + 1} / ${quizPool.length}</span><span>점수 ${quizScore}</span></div>
    <div class="quiz-track"><div class="quiz-fill" style="width:${pct}%"></div></div>
    <div class="quiz-question">${q.question}</div>
    <div class="quiz-choices">
      ${q.choices.map((c, i) => `<button class="quiz-choice" onclick="answerQuiz(${i})">${c}</button>`).join('')}
    </div>
  `;
}
function answerQuiz(i) {
  const q = quizPool[quizIndex];
  const buttons = document.querySelectorAll('.quiz-choice');
  buttons.forEach(b => b.onclick = null);
  buttons[q.answer].classList.add('correct');
  if (i === q.answer) {
    quizScore++;
    playCorrectSound();
  } else {
    buttons[i].classList.add('wrong');
    playWrongSound();
  }
  setTimeout(() => { quizIndex++; showQuizQuestion(); }, 900);
}
function showQuizResult() {
  const best = Number(localStorage.getItem('italianQuizBest') || 0);
  if (quizScore > best) localStorage.setItem('italianQuizBest', quizScore);
  document.getElementById('quiz-area').innerHTML = `
    <div class="quiz-result">
      <div>수고하셨어요!</div>
      <div class="score">${quizScore} / ${quizPool.length}</div>
      <button class="btn-main" onclick="startQuiz()">다시 도전하기</button>
    </div>
  `;
}

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국어 사전 | 汉语词典</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red:    #C8102E;
    --red2:   #8f0c21;
    --gold:   #FFD700;
    --gold2:  #f0c419;
    --text:   #2a2118;
    --sub:    #7a6f5e;
    --bg:     #fffdf7;
    --card:   #ffffff;
    --border: #f0e2c0;
  }

  body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    background: linear-gradient(135deg, var(--red), var(--red2));
    padding: 22px 5% 26px; text-align: center; color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .back-link {
    display: inline-block; margin-bottom: 10px;
    color: var(--gold); text-decoration: none; font-size: 0.82rem;
    border: 1px solid rgba(255,215,0,0.5); padding: 5px 12px; border-radius: 8px;
    transition: all 0.2s;
  }
  .back-link:hover { background: rgba(255,215,0,0.15); }
  .header-title { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.5px; }
  .header-sub { font-size: 0.85rem; margin-top: 4px; opacity: 0.85; }

  .container { max-width: 780px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ── 성조 범례 ── */
  .tone-legend {
    display: flex; flex-wrap: wrap; gap: 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px;
  }
  .tone-chip { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--sub); }
  .tone-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  /* ── 검색 & 필터 ── */
  .search-box {
    display: flex; gap: 8px; background: #fff;
    border: 2px solid var(--gold); border-radius: 14px;
    padding: 6px 6px 6px 18px; box-shadow: 0 2px 10px rgba(255,215,0,0.2);
  }
  .search-box input {
    flex: 1; border: none; outline: none; font-size: 1.05rem;
    padding: 12px 0; color: var(--text); background: transparent;
  }
  .search-box button {
    background: var(--red); color: #fff; border: none; border-radius: 10px;
    padding: 0 20px; font-weight: 700; cursor: pointer; font-size: 0.95rem;
    transition: background 0.15s;
  }
  .search-box button:hover { background: var(--red2); }

  .cat-filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .cat-chip {
    border: 2px solid var(--red); background: #fff; border-radius: 999px;
    padding: 6px 16px; font-size: 0.85rem; font-weight: 700; cursor: pointer; color: var(--red);
    transition: all 0.15s;
  }
  .cat-chip.active { background: var(--red); color: #fff; }

  .search-meta { margin: 10px 2px 14px; font-size: 0.85rem; color: var(--sub); }
  .search-meta b { color: var(--text); }

  /* ── 결과 리스트 ── */
  .result-list { display: flex; flex-direction: column; gap: 10px; }
  .word-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; cursor: pointer; transition: box-shadow 0.15s, transform 0.1s;
  }
  .word-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); transform: translateY(-1px); }
  .word-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .word-hanzi { font-size: 1.4rem; font-weight: 800; }
  .word-pinyin span { font-weight: 700; }
  .word-cat { font-size: 0.72rem; color: var(--red); background: #fff0f0; padding: 2px 8px; border-radius: 6px; }
  .word-meaning { margin-top: 4px; font-size: 0.95rem; color: #4a4030; }

  /* ── 상세 패널 ── */
  .detail-panel {
    display: none; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 22px 24px; margin-bottom: 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.06);
  }
  .detail-panel.open { display: block; }
  .detail-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .detail-hanzi { font-size: 2rem; font-weight: 800; }
  .detail-pinyin { font-size: 1.2rem; margin-top: 6px; }
  .detail-pinyin span { font-weight: 700; }
  .speak-btn {
    border: none; background: var(--gold); width: 38px; height: 38px; border-radius: 50%;
    cursor: pointer; font-size: 1.05rem; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .speak-btn:hover { background: var(--gold2); }
  .detail-meaning { margin-top: 12px; font-size: 1.1rem; font-weight: 600; }
  .detail-example {
    margin-top: 14px; background: #fff8ea; border-left: 4px solid var(--gold);
    padding: 10px 14px; border-radius: 6px;
  }
  .detail-example .zh { font-weight: 700; font-size: 1.05rem; }
  .detail-example .py { margin-top: 3px; font-size: 0.85rem; color: var(--sub); font-style: italic; }
  .detail-example .ko { margin-top: 4px; font-size: 0.9rem; color: var(--sub); }

  .empty-state { text-align: center; color: var(--sub); padding: 40px 0; font-size: 0.95rem; }

  @media (max-width: 480px) {
    .header-title { font-size: 1.3rem; }
    .detail-hanzi { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="../index.html">← 포트폴리오로</a>
  <div class="header-title">🏮 汉语词典 중국어 사전</div>
  <div class="header-sub">단어 검색 · 성조 색상 구분 · 발음 듣기</div>
</header>

<div class="container">
  <div class="tone-legend" id="toneLegend"></div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="한자, 병음, 뜻으로 검색... (예: 你好, ni hao, 안녕)" autocomplete="off">
    <button onclick="renderResults()">검색</button>
  </div>

  <div class="cat-filters" id="catFilters"></div>

  <div id="detailPanel" class="detail-panel"></div>

  <div class="search-meta" id="searchMeta"></div>
  <div class="result-list" id="resultList"></div>
</div>

<script src="data.js"></script>
<script>
// ── TTS: 중국어(zh-CN) 음성 ──
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('이 브라우저는 음성 합성을 지원하지 않아요.'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => v.lang.toLowerCase().startsWith('zh'));
  u.lang = zhVoice ? zhVoice.lang : 'zh-CN';
  if (zhVoice) u.voice = zhVoice;
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

// ── 성조 색상 병음 렌더링 ──
function colorizePinyin(pinyin, tones) {
  const syllables = pinyin.split(' ');
  return syllables.map((syl, i) => {
    const tone = tones[i] || 5;
    const color = TONE_COLORS[tone] || TONE_COLORS[5];
    return `<span style="color:${color}">${escapeHtml(syl)}</span>`;
  }).join(' ');
}

// ── 성조 범례 ──
function renderToneLegend() {
  document.getElementById('toneLegend').innerHTML = [1,2,3,4,5].map(t => `
    <div class="tone-chip">
      <span class="tone-dot" style="background:${TONE_COLORS[t]}"></span>
      ${escapeHtml(TONE_DESC[t])}
    </div>
  `).join('');
}

// ── 카테고리 필터 ──
let currentCat = '전체';
function renderCatFilters() {
  const cats = ['전체', ...new Set(CHINESE_WORDS.map(w => w.category))];
  document.getElementById('catFilters').innerHTML = cats.map(c =>
    `<button class="cat-chip ${c === currentCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
}
function setCat(cat) {
  currentCat = cat;
  renderCatFilters();
  renderResults();
}

// ── 검색 ──
function search(query) {
  const q = query.trim().toLowerCase();
  let list = currentCat === '전체' ? CHINESE_WORDS : CHINESE_WORDS.filter(w => w.category === currentCat);
  if (!q) return list;
  return list.filter(w =>
    w.hanzi.includes(q) ||
    w.pinyin.toLowerCase().includes(q) ||
    w.meaning.toLowerCase().includes(q)
  );
}

function renderResults() {
  const q = document.getElementById('searchInput').value;
  const results = search(q);
  const list = document.getElementById('resultList');
  const meta = document.getElementById('searchMeta');

  meta.innerHTML = q.trim()
    ? `<b>"${escapeHtml(q)}"</b> 검색 결과 <b>${results.length}</b>건`
    : `<b>${currentCat}</b> 단어 <b>${results.length}</b>개`;

  if (results.length === 0) {
    list.innerHTML = `<div class="empty-state">검색 결과가 없어요. 다른 단어로 시도해보세요.</div>`;
    return;
  }

  list.innerHTML = results.map(w => `
    <div class="word-card" onclick="showDetail(${CHINESE_WORDS.indexOf(w)})">
      <div class="word-row">
        <span class="word-hanzi">${escapeHtml(w.hanzi)}</span>
        <span class="word-pinyin">${colorizePinyin(w.pinyin, w.tones)}</span>
        <span class="word-cat">${escapeHtml(w.category)}</span>
      </div>
      <div class="word-meaning">${escapeHtml(w.meaning)}</div>
    </div>
  `).join('');
}

function showDetail(idx) {
  const w = CHINESE_WORDS[idx];
  const panel = document.getElementById('detailPanel');
  const exampleHtml = w.example ? `
    <div class="detail-example">
      <div class="zh">${escapeHtml(w.example.zh)}
        <button class="speak-btn" style="width:28px;height:28px;font-size:0.8rem;vertical-align:middle;margin-left:4px"
          onclick="speak('${w.example.zh.replace(/'/g, "\\'")}')" title="예문 듣기">🔊</button>
      </div>
      <div class="py">${escapeHtml(w.example.pinyin)}</div>
      <div class="ko">${escapeHtml(w.example.ko)}</div>
    </div>
  ` : '';

  panel.innerHTML = `
    <div class="detail-top">
      <span class="detail-hanzi">${escapeHtml(w.hanzi)}</span>
      <button class="speak-btn" onclick="speak('${w.hanzi.replace(/'/g, "\\'")}')" title="발음 듣기">🔊</button>
    </div>
    <div class="detail-pinyin">${colorizePinyin(w.pinyin, w.tones)}</div>
    <div class="detail-meaning">${escapeHtml(w.meaning)}</div>
    ${exampleHtml}
  `;
  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('searchInput').addEventListener('input', renderResults);
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};
renderToneLegend();
renderCatFilters();
renderResults();
</script>

</body>
</html>

<html lang="ko">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날씨 지도 – 한국 & 미국</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d0d2b;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 헤더 ── */
    .header {
      background: rgba(8, 8, 32, 0.97);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
      z-index: 1000;
    }
    .header h1 { font-size: 1.1rem; white-space: nowrap; }

    .tabs { display: flex; gap: 8px; }
    .tab-btn {
      padding: 7px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: #8892b0;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
    .tab-btn.active { background: #e94560; border-color: #e94560; color: #fff; }

    .api-section {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .api-section label { font-size: 11px; color: #8892b0; white-space: nowrap; }
    .api-section input {
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 11px;
      width: 210px;
    }
    .api-section input::placeholder { color: #555; }
    .btn-apply  { padding: 6px 12px; border-radius: 7px; border: none; background: #e94560; color: #fff; cursor: pointer; font-size: 11px; }
    .btn-reset  { padding: 6px 10px; border-radius: 7px; border: 1px solid #555; background: transparent; color: #8892b0; cursor: pointer; font-size: 11px; }
    .btn-apply:hover { background: #c0392b; }
    .btn-reset:hover { color: #fff; }

    .demo-badge {
      background: #f39c12;
      color: #000;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    /* ── 지도 ── */
    #map { flex: 1; z-index: 1; }

    /* ── 로딩 ── */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(8, 8, 32, 0.95);
      border: 1px solid rgba(233,69,96,0.5);
      border-radius: 14px;
      padding: 24px 36px;
      z-index: 99999;
      text-align: center;
      display: none;
    }
    #loading.show { display: block; }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid rgba(233,69,96,0.25);
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 13px; color: #8892b0; }

    /* ── 범례 ── */
    .legend {
      position: fixed;
      bottom: 28px;
      left: 14px;
      z-index: 1000;
      background: rgba(8, 8, 32, 0.88);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 11px 14px;
      pointer-events: none;
    }
    .legend h4 { font-size: 10px; color: #8892b0; margin-bottom: 7px; letter-spacing: 0.5px; }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 10px; color: #ccc; margin-bottom: 4px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    /* API 안내 배너 */
    #api-notice {
      position: fixed;
      bottom: 28px;
      right: 14px;
      z-index: 1000;
      background: rgba(243,156,18,0.12);
      border: 1px solid rgba(243,156,18,0.4);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 11px;
      color: #f0c060;
      max-width: 260px;
      line-height: 1.5;
      display: none;
    }
    #api-notice.show { display: block; }
    #api-notice a { color: #f39c12; }

    /* ── 날씨 마커 ── */
    .weather-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .weather-marker:hover { transform: scale(1.2); }
    .m-icon { font-size: 18px; line-height: 1; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.7)); }
    .m-temp {
      font-weight: 800;
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 10px;
      margin-top: 2px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      box-shadow: 0 2px 8px rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.2);
      white-space: nowrap;
    }
    .m-name {
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px #000, 0 0 8px #000;
      margin-top: 2px;
      white-space: nowrap;
    }

    /* ── Leaflet 팝업 오버라이드 ── */
    .leaflet-popup-content-wrapper {
      background: rgba(8, 8, 32, 0.97) !important;
      border: 1px solid rgba(233,69,96,0.45) !important;
      border-radius: 14px !important;
      color: #fff !important;
      box-shadow: 0 8px 36px rgba(0,0,0,0.65) !important;

    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button { color: #555 !important; font-size: 18px !important; top: 8px !important; right: 10px !important; }

    .p-city { font-size: 15px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 9px; margin-bottom: 11px; }
    .p-main { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
    .p-icon { font-size: 40px; line-height: 1; }
    .p-temp { font-size: 32px; font-weight: 800; }
    .p-cond { font-size: 12px; color: #8892b0; margin-top: 2px; }
    .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .p-cell { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 7px 10px; }
    .p-label { font-size: 10px; color: #8892b0; }
    .p-val   { font-size: 14px; font-weight: 700; margin-top: 1px; }
    .p-demo  { font-size: 10px; color: #f39c12; margin-top: 9px; text-align: center; }
  </style>
</head>

function tempColor(t) {
  if (t <  0) return '#81d4fa';
  if (t < 10) return '#4fc3f7';
  if (t < 20) return '#81c784';
  if (t < 25) return '#aed581';
  if (t < 30) return '#ffd54f';
  if (t < 35) return '#ff8a65';
  return '#ef5350';
}

function weatherEmoji(icon) {
  const p = (icon || '01d').slice(0, 2);
  return {'01':'☀️','02':'⛅','03':'☁️','04':'☁️','09':'🌧️','10':'🌦️','11':'⛈️','13':'❄️','50':'🌫️'}[p] || '🌤️';
}

// 시드 난수 (데모 데이터용 – 새로고침해도 같은 값)
function srand(s) { const x = Math.sin(s+1)*10000; return x - Math.floor(x); }

  {icon:'01d', label:'맑음',      h:[20,45], w:[1,4]  },

  {icon:'50d', label:'안개',      h:[85,99], w:[0,2]  },
];

function demoData(key, base) {
  let s = 0;
  for (let i = 0; i < key.length; i++) s += key.charCodeAt(i) * (i + 1);
  const c    = demoConds[Math.floor(srand(s)   * demoConds.length)];
  const temp = Math.round(base + srand(s+1) * 6 - 3);
  return {
    icon:      c.icon,
    label:     c.label,
    temp,
    feels:     temp - Math.round(srand(s+2) * 3 + 1),
    humidity:  Math.round(srand(s+3) * (c.h[1]-c.h[0]) + c.h[0]),
    wind:      (srand(s+4) * (c.w[1]-c.w[0]) + c.w[0]).toFixed(1),
    vis:       Math.round(srand(s+5) * 8 + 3),
    isDemo:    true,
  };
}

function applyKey() {
  const v = document.getElementById('api-input').value.trim();
  if (!v) { alert('API 키를 입력해주세요.'); return; }
  apiKey = v;
  localStorage.setItem('owm_key', apiKey);
  document.getElementById('demo-badge').style.display = 'none';
  document.getElementById('api-notice').classList.remove('show');
  loadWeather();
}

function resetKey() {
  apiKey = '';
  localStorage.removeItem('owm_key');
  document.getElementById('api-input').value = '';
  document.getElementById('demo-badge').style.display = '';
  loadWeather();
}

// ==============================================
// 실제 API 호출
// ==============================================
async function fetchOne(lat, lon) {
  const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=kr`;
  const res  = await fetch(url);
  if (!res.ok) throw new Error(res.status);
  const d = await res.json();
  return {
    icon:     d.weather[0].icon,
    label:    d.weather[0].description,
    temp:     Math.round(d.main.temp),
    feels:    Math.round(d.main.feels_like),
    humidity: d.main.humidity,
    wind:     d.wind.speed.toFixed(1),
    vis:      Math.round((d.visibility || 10000) / 1000),
    isDemo:   false,
  };
}

// ==============================================
// 마커 생성
// ==============================================
function makeMarker(lat, lon, label, w) {
  const color = tempColor(w.temp);
  const emoji = weatherEmoji(w.icon);

  const icon = L.divIcon({
    className: '',
    html: `<div class="weather-marker">
             <div class="m-icon">${emoji}</div>
             <div class="m-temp" style="background:${color}">${w.temp}°</div>
             <div class="m-name">${label}</div>
           </div>`,
    iconSize:   [70, 60],
    iconAnchor: [35, 30],
    popupAnchor:[0, -34],
  });

  const demoNote = w.isDemo
    ? `<div class="p-demo">⚠️ 샘플 데이터입니다 (API 키 필요)</div>` : '';

  const popup = `
    <div class="p-city">${label}</div>
    <div class="p-main">
      <div class="p-icon">${emoji}</div>
      <div>
        <div class="p-temp">${w.temp}°C</div>
        <div class="p-cond">${w.label}</div>
      </div>
    </div>
    <div class="p-grid">
      <div class="p-cell"><div class="p-label">체감온도</div><div class="p-val">${w.feels}°C</div></div>
      <div class="p-cell"><div class="p-label">습도</div><div class="p-val">${w.humidity}%</div></div>
      <div class="p-cell"><div class="p-label">바람</div><div class="p-val">${w.wind} m/s</div></div>
      <div class="p-cell"><div class="p-label">가시거리</div><div class="p-val">${w.vis} km</div></div>
    </div>
    ${demoNote}`;

  return L.marker([lat, lon], { icon }).bindPopup(popup, { maxWidth: 240, minWidth: 220 });
}

// ==============================================
// 날씨 로드
// ==============================================
async function loadWeather() {
  layer.clearLayers();
  const cities = curView === 'korea' ? koreaCities : usStates;

  if (!apiKey) {
    document.getElementById('api-notice').classList.add('show');
    cities.forEach(c => {
      const key  = c.name || c.abbr;
      const label = curView === 'korea' ? c.name : `${c.abbr}`;
      const w    = demoData(key, c.base);
      makeMarker(c.lat, c.lon, label, w).addTo(layer);
    });
    return;
  }

  document.getElementById('api-notice').classList.remove('show');
  showLoad(true);

  // 10개씩 배치 처리 (API 레이트 리밋 방지)
  const BATCH = 10;
  let done = 0;
  for (let i = 0; i < cities.length; i += BATCH) {
    const slice = cities.slice(i, i + BATCH);
    await Promise.all(slice.map(async c => {
      try {
        const w     = await fetchOne(c.lat, c.lon);
        const label = curView === 'korea' ? c.name : c.abbr;
        makeMarker(c.lat, c.lon, label, w).addTo(layer);
      } catch (e) {
        // 실패한 도시는 데모 데이터로 대체
        const key  = c.name || c.abbr;
        const w    = demoData(key, c.base);
        const label = curView === 'korea' ? c.name : c.abbr;
        makeMarker(c.lat, c.lon, label, w).addTo(layer);
      }
      done++;
      document.getElementById('loading-text').textContent =
        `날씨 데이터 불러오는 중... (${done}/${cities.length})`;
    }));
    if (i + BATCH < cities.length) await sleep(150);
  }
  showLoad(false);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function showLoad(show) {
  document.getElementById('loading').classList.toggle('show', show);
}

// ==============================================
// 탭 전환
// ==============================================
function switchView(view, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curView = view;
  const v = VIEWS[view];
  map.setView(v.center, v.zoom);
  loadWeather();
}

// ==============================================
// 시작
// ==============================================
map.setView(VIEWS.korea.center, VIEWS.korea.zoom);
loadWeather();
</script>

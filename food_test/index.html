<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 뭐 먹지? 🍽️</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', 'Segoe UI', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #FF6B35 0%, #F7C59F 50%, #FFF3E0 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: white;
  border-radius: 28px;
  padding: 40px 36px;
  max-width: 500px;
  width: 100%;
  box-shadow: 0 24px 64px rgba(0,0,0,0.14);
  animation: fadeUp 0.4s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 시작 화면 */
.start-icon { font-size: 88px; text-align: center; margin-bottom: 12px; }
.start-title { font-size: 30px; font-weight: 900; text-align: center; color: #1a1a1a; margin-bottom: 6px; }
.start-sub { font-size: 15px; text-align: center; color: #888; margin-bottom: 32px; line-height: 1.6; }
.btn-start {
  display: block; width: 100%; padding: 17px;
  background: linear-gradient(135deg, #FF6B35, #E8450A);
  color: white; border: none; border-radius: 16px;
  font-size: 18px; font-weight: 700; cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  letter-spacing: -0.3px;
}
.btn-start:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(255,107,53,.45); }

/* 진행 바 */
.progress-wrap { margin-bottom: 28px; }
.progress-meta { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 8px; }
.progress-bar { height: 7px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #FF6B35, #E8450A); border-radius: 4px; transition: width .45s ease; }

/* 질문 화면 */
.q-num { font-size: 13px; font-weight: 700; color: #FF6B35; margin-bottom: 6px; letter-spacing: .5px; }
.q-text { font-size: 21px; font-weight: 800; color: #1a1a1a; margin-bottom: 26px; line-height: 1.4; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice-btn {
  padding: 18px 12px; background: #fafafa; border: 2px solid #eee;
  border-radius: 16px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: all .2s; text-align: center;
  color: #444; line-height: 1.45;
}
.choice-btn:hover { border-color: #FF6B35; background: #fff7f4; color: #FF6B35; transform: translateY(-3px); box-shadow: 0 6px 18px rgba(255,107,53,.15); }
.choice-btn:active { transform: translateY(0); }

/* 로딩 화면 */
.loading-wrap { text-align: center; padding: 30px 0; }
.loading-icon { font-size: 68px; display: block; animation: bounce .55s infinite alternate; }
@keyframes bounce { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-18px) rotate(5deg); } }
.loading-title { font-size: 20px; font-weight: 800; color: #1a1a1a; margin-top: 22px; }
.loading-sub { font-size: 14px; color: #aaa; margin-top: 6px; }
.loading-dots span { display: inline-block; animation: dot 1.2s infinite; }
.loading-dots span:nth-child(2) { animation-delay: .2s; }
.loading-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%,80%,100%{ opacity:.2; transform: scale(.8); } 40%{ opacity:1; transform: scale(1.1); } }

/* 결과 화면 */
.result-badge {
  background: linear-gradient(135deg, #FF6B35, #E8450A);
  color: white; font-size: 12px; font-weight: 700;
  padding: 5px 14px; border-radius: 20px;
  display: inline-block; margin-bottom: 14px; letter-spacing: .5px;
}
.result-center { text-align: center; }
.result-icon { font-size: 90px; margin: 4px 0 8px; display: block; animation: pop .5s cubic-bezier(.175,.885,.32,1.275); }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.result-name { font-size: 34px; font-weight: 900; color: #1a1a1a; margin-bottom: 10px; }
.result-desc { font-size: 15px; color: #666; line-height: 1.75; margin-bottom: 18px; }
.result-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; }
.tag { padding: 6px 14px; background: #fff5f0; color: #FF6B35; border-radius: 20px; font-size: 13px; font-weight: 600; }
.result-tip {
  background: #f9f9f9; border-left: 4px solid #FF6B35;
  border-radius: 0 12px 12px 0; padding: 16px 18px;
  font-size: 14px; color: #555; line-height: 1.7; margin-bottom: 24px;
}
.result-tip strong { color: #FF6B35; }
.btn-group { display: flex; flex-direction: column; gap: 10px; }
.btn-retry {
  display: block; width: 100%; padding: 14px;
  background: #f2f2f2; color: #555; border: none;
  border-radius: 14px; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: background .2s;
}
.btn-retry:hover { background: #e5e5e5; }

/* 뒤로 버튼 */
.back-btn {
  position: fixed; top: 18px; left: 18px;
  background: white; border: none; border-radius: 50%;
  width: 44px; height: 44px; font-size: 20px;
  cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.12);
  display: flex; align-items: center; justify-content: center;
  transition: transform .2s;
}
.back-btn:hover { transform: scale(1.1); }

@media (max-width: 420px) {
  .card { padding: 30px 22px; }
  .choices { grid-template-columns: 1fr; }
}
</style>
</head>

  { name:"햄버거",   emoji:"🍔", desc:"두툼한 패티와 신선한 채소의 조화! 간단하고 빠르게 즐길 수 있는 든든한 한 끼입니다.", tags:["#패스트푸드","#간편식","#배달"], tip:"💡 감자튀김에 <strong>치즈소스</strong>를 찍어 먹으면 더욱 맛있어요!" },
  { name:"샐러드",   emoji:"🥗", desc:"신선하고 가벼운 한 끼! 건강을 챙기고 싶은 날, 다양한 채소와 드레싱으로 맛있게 즐겨보세요.", tags:["#다이어트","#건강식","#가벼워"], tip:"💡 <strong>닭가슴살이나 연어</strong>를 토핑으로 추가하면 포만감도 채울 수 있어요!" },
  { name:"칼국수",   emoji:"🍝", desc:"손으로 칼칼 썬 면발의 구수한 국물! 비 오는 날이나 몸이 지칠 때 생각나는 따뜻한 위로 음식입니다.", tags:["#비오는날","#따뜻해","#구수해"], tip:"💡 <strong>바지락</strong>이 들어간 해물칼국수는 시원한 국물 맛이 일품이에요!" },
  { name:"곱창",     emoji:"🔥", desc:"쫄깃하고 고소한 곱창! 특유의 진한 맛이 있어 좋아하는 사람은 정말 못 끊는 중독성 있는 음식입니다.", tags:["#야식","#술안주","#고소해"], tip:"💡 <strong>볶음밥</strong>을 마지막에 시켜 곱창 기름에 볶아 먹으면 정말 맛있어요!" }
];

let step = 0;
let totals = [];

function init() {
  step = 0;
  totals = new Array(foods.length).fill(0);
  renderStart();
}

function renderStart() {
  render(`
    <div class="start-icon">🍽️</div>
    <div class="start-title">오늘 뭐 먹지?</div>
    <div class="start-sub">단 5가지 질문으로<br>딱 맞는 오늘의 메뉴를 추천해 드려요!</div>
    <button class="btn-start" onclick="renderQuestion()">테스트 시작하기 →</button>
  `);
}

function renderQuestion() {
  const q = questions[step];
  const pct = Math.round((step / questions.length) * 100);
  render(`
    <div class="progress-wrap">
      <div class="progress-meta"><span>질문 ${step + 1} / ${questions.length}</span><span>${pct}%</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-num">Q${step + 1}.</div>
    <div class="q-text">${q.q}</div>
    <div class="choices">
      ${q.choices.map((c, i) => `<button class="choice-btn" onclick="pick(${i})">${c}</button>`).join('')}
    </div>
  `);
}

function pick(choice) {
  scores[step][choice].forEach((v, i) => totals[i] += v);
  step++;
  if (step < questions.length) {
    renderQuestion();
  } else {
    renderLoading();
  }
}

function renderLoading() {
  const frames = ['🤔','🍳','🥘','🍽️','✨'];
  let fi = 0;
  render(`
    <div class="loading-wrap">
      <span class="loading-icon" id="lIcon">🤔</span>
      <div class="loading-title">메뉴 분석 중<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
      <div class="loading-sub">딱 맞는 음식을 찾고 있어요!</div>
    </div>
  `);
  const iv = setInterval(() => {
    fi = (fi + 1) % frames.length;
    const el = document.getElementById('lIcon');
    if (el) el.textContent = frames[fi];
  }, 320);
  setTimeout(() => { clearInterval(iv); renderResult(); }, 2000);
}

function renderResult() {
  const idx = totals.indexOf(Math.max(...totals));
  const f = foods[idx];
  render(`
    <div class="result-center">
      <div class="result-badge">✨ 오늘의 추천 메뉴</div>
      <span class="result-icon">${f.emoji}</span>
      <div class="result-name">${f.name}</div>
      <div class="result-desc">${f.desc}</div>
      <div class="result-tags">${f.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
    <div class="result-tip">${f.tip}</div>
    <div class="btn-group">
      <button class="btn-retry" onclick="init()">🔄 다시 테스트하기</button>
    </div>
  `);
}

function render(html) {
  const app = document.getElementById('app');
  app.style.animation = 'none';
  app.offsetHeight; /* reflow */
  app.style.animation = 'fadeUp .35s ease';
  app.innerHTML = html;
}

init();
</script>
</body>
</html>
